    [
      { id:'R4-S1', name:'Admin dashboard',               val:6,  est:4 },
      { id:'R4-S2', name:'Bulk order tools',              val:8,  est:5, linked:true },
      { id:'R4-S3', name:'Fraud detection',               val:13, est:7 },
      { id:'R4-S4', name:'One-click reorder',             val:4,  est:3, linked:true },
      { id:'R4-S5', name:'Accessibility pass',            val:2,  est:2, polish:true },
      { id:'R4-S6', name:'Performance tuning',            val:4,  est:3 },
      { id:'R4-S7', name:'Multi-currency support',        val:10, est:6, linked:true },
      { id:'R4-S8', name:'Seasonal theme pack',           val:1,  est:1, polish:true },
    ],
  ];
  const ALL_STORIES = SPRINTS.flat();
  const TOTAL_ROUNDS = SPRINTS.length; // was CFG.targets.length before §11.6 removed targets
  function backlogForRound(roundIndex){ return SPRINTS[roundIndex] || []; }
  const CFG = {
    capacity:20,
    // §11.6 (rev. 3): capacity is a soft budget, not a hard gate. There is no
    // target anymore — no clear bonus, no miss penalty, no value cap. A story
    // that completes within actual (post-dice) capacity pays full value; a
    // story that doesn't still pays overrunCredit×value instead of zero, on
    // top of brokenPenalty. Overreach is a real, felt trade — not blocked in
    // the UI, not zeroed out if it doesn't land, just genuinely worse than it
    // would have been if it had fit.
    overrunCredit:0.15,
    // Penalty for overrunning capacity raised further: less partial credit
    // for broken work (0.3 → 0.15) and a bigger flat penalty per broken
    // story (5 → 10), so overrun×value − brokenPenalty is more negative even
    // for the highest-value story in any backlog (max 13 after the §11.5
    // rebalance: 13×0.15−10 = −8.05, vs. −1.1 before). Overreaching now stings
    // noticeably harder — "commit to something you're certain won't fit" is a
    // clearly losing move, not just a marginally negative one.
    brokenPenalty:10,
    spikeCost:2,
    // crunchNextPenalty is now a PER-STREAK multiplier, not a flat hit — see
    // resolveTeamRound: hangover = crunchNextPenalty * consecutive crunches.
    crunchGain:3, crunchNextPenalty:3, crunchBugPenalty:3, crunchBugThreshold:3,
    midHi:1, midMax:2, bigHi:2, bigMax:4,
    // Same-round insurance (§5.3): idle capacity absorbs overruns invisibly via
    // bestCompletion's capacity check — no config needed for that part. These
    // two just gate the small, capped cross-round carry: leave at least
    // slackCarryThreshold capacity unused with zero broken promises this round
    // and the next round starts with slackCarryAmount extra capacity.
    slackCarryThreshold:6, slackCarryAmount:2,
  };
  // SPIKE (disabled — reserved for future estimation/spikes scope, per the
  // handoff doc). One switch gates every spike-related effect and UI element
  // below (each gated spot carries its own "SPIKE (disabled)" comment so it's
  // easy to find) — flip this to true and the feature returns intact: the
  // variance-skip in workStory, the capacity surcharge, the commit-screen
  // toggle and its cost, autoPickCommit's spike-the-big-stories fallback, and
  // the spike tags on the submitted/result/leaderboard screens (those already
  // no-op safely today since spikeIds/spikes stay empty while this is false).
  const SPIKE_ENABLED = false;
  // Auto-pick (disabled): when a team times out with nothing selected, or
  // never opens the picker at all, this used to drop in a legal default
  // commitment (autoPickCommit below) rather than let them ship nothing.
  // Turned off — a team that runs out of time or never submits now just
  // gets an empty commitment (0 shipped this round), same as before that
  // fallback existed. autoPickCommit is left intact and unused so this can
  // be flipped back on later.
  const AUTO_PICK_ENABLED = false;
  const CURVEBALLS = {
    none:        { tone:'neutral', desc:'Nothing unusual happened this round — costs played out exactly as planned.' },
    security:    { tone:'bad',     desc:'A compliance check ate into the schedule: every big story (estimate 6 or higher) cost 2 more capacity than planned. That\'s likely why a big commitment ran over.' },
    pivot:       { tone:'good',    desc:'Leadership asked for polish: polish stories shipped for double their usual value this round — that works in your favor.' },
    integration: { tone:'good',    desc:'Shared infrastructure was already in place: \'linked\' stories cost 1 less capacity than planned — that works in your favor.' },
    turnover:    { tone:'bad',     desc:'Someone left mid-sprint: your single biggest committed story cost 2 more capacity than planned. That\'s likely why capacity ran short.' },
  };
  const CB_KEYS = ['security','pivot','integration','turnover','none'];
  // Only one round per game gets a good-or-neutral curveball; every other
  // round draws a bad one. Randomized fully (§ earlier rev) meant a team
  // could get lucky two or three rounds running and never feel the cost of
  // overcommitting — that muddies the lesson. Generated once per game
  // (first call to resolveRound below) and stored on room state, not
  // per-round, so it's fixed for the whole game rather than re-rolled.
  const GOOD_NEUTRAL_CBS = ['none', 'pivot', 'integration'];
  const BAD_CBS = ['security', 'turnover'];
  function generateCurveballSequence(){
    const goodRound = Math.floor(Math.random() * TOTAL_ROUNDS);
    return Array.from({ length: TOTAL_ROUNDS }, (_, i) =>
      i === goodRound
        ? GOOD_NEUTRAL_CBS[Math.floor(Math.random() * GOOD_NEUTRAL_CBS.length)]
        : BAD_CBS[Math.floor(Math.random() * BAD_CBS.length)]
    );
  }

  function byId(id){ return ALL_STORIES.find(s => s.id === id); }
  function d6(){ return 1 + Math.floor(Math.random()*6); }
  function tierOf(e){ return e<=2 ? 'safe' : (e<=5 ? 'mid' : 'big'); }
  function valueOf(s, cb){ return (cb==='pivot' && s.polish) ? s.val*2 : s.val; }

  function workStory(s, { spiked, cb, isHi }){
    // SPIKE (disabled): while SPIKE_ENABLED is false, a story is never treated
    // as spiked here regardless of what was passed in, so the variance roll
    // below always runs and the capacity surcharge at the bottom never applies.
    const effectiveSpiked = SPIKE_ENABLED && spiked;
    const tier = tierOf(s.est);
    let base = s.est;
    let variance = 0, blowup = false;
    // cb!=='none' guard: the 'none' curveball's own copy promises "costs
    // played out exactly as planned" — that has to actually be true, or a
    // team can land on 20/20 planned, draw "nothing unusual happened," and
    // still eat a broken-promise penalty from a dice roll they were told
    // didn't apply this round. Every other curveball still rolls variance.
    if (!effectiveSpiked && tier!=='safe' && cb!=='none'){
      const r = d6();
      if (tier==='mid') variance = r<=3?0:(r<=5?CFG.midHi:CFG.midMax);
      else              variance = r<=3?0:(r<=5?CFG.bigHi:CFG.bigMax);
      blowup = (tier==='big' && r===6);
    }
    let cost = base + variance, cbMod = 0;
    if (cb==='security' && s.est>=6) cbMod += 2;
    if (cb==='integration' && s.linked) cbMod -= 1;
    if (cb==='turnover' && isHi) cbMod += 2;
    cost += cbMod;
    if (effectiveSpiked) cost += CFG.spikeCost;
    return { cost: Math.max(0,cost), variance, blowup };
  }
  function bestCompletion(items, capacity){
    const n = items.length; let best = { ids:[], rawVal:0, cost:0, score:-Infinity };
    for (let m=0; m<(1<<n); m++){
      let cost=0, val=0, ids=[];
      for (let i=0;i<n;i++) if (m&(1<<i)){ cost+=items[i].cost; val+=items[i].value; ids.push(items[i].id); }
      if (cost<=capacity){ const score = val - CFG.brokenPenalty*(n-ids.length); if (score>best.score) best={ids,rawVal:val,cost,score}; }
    }
    if (best.score===-Infinity) best={ids:[],rawVal:0,cost:0,score:0};
    return best;
  }

  // A legal default commitment for a team that runs out of time with nothing
  // picked (timeout) or never opens the picker (no-show). §11.6: there's no
  // target to chase anymore, so this just conservatively fills capacity with
  // the best available value/estimate stories, preferring lower-risk ones —
  // a reasonable default a non-present team would want, not a risk-taker
  // gambling on their behalf. Not a guaranteed best outcome — just legal and
  // not deliberately bad, which is the whole point of replacing the harsh
  // empty-commit auto-fail.
  function autoPickCommit(state, roundIndex){
    const cap = CFG.capacity + (state.carry || 0);
    const ranked = backlogForRound(roundIndex).map(s => {
      const est = s.est;
      const tier = tierOf(est);
      return { s, est, tier, density: valueOf(s, null) / Math.max(0.5, est) };
    }).sort((a, b) =>
      (a.tier === 'big' ? 1 : 0) - (b.tier === 'big' ? 1 : 0) || // non-big first (blowup risk)
      b.density - a.density ||                                     // then most value per estimate
      a.est - b.est                                               // then cheaper
    );
    const commitIds = [], spikeIds = []; // spikeIds stays empty while SPIKE_ENABLED is false
    let usedEst = 0;
    for (const { s, est, tier } of ranked){
      // SPIKE (disabled): this used to pay CFG.spikeCost to spike every "big"
      // story it had to include, removing its blowup risk so the fallback
      // wasn't sabotaged by bad luck. That protection doesn't exist while
      // spike is disabled, so auto-pick stops paying for it too.
      const addCost = est + (SPIKE_ENABLED && tier === 'big' ? CFG.spikeCost : 0);
      if (usedEst + addCost > cap) continue; // stays within capacity — no deliberate overreach on a team's behalf
      commitIds.push(s.id);
      usedEst += addCost;
      if (SPIKE_ENABLED && tier === 'big') spikeIds.push(s.id);
    }
    return { commitIds, spikeIds };
  }

  // Resolve one team's round from human inputs.
  // state = { carry, cumScore, crunchStreak }
  function resolveTeamRound({ commitIds, spikeIds, crunch, cb, roundIndex, state }){
    const baseCap = CFG.capacity + (state.carry||0);
    let capacity = baseCap;
    const isFinal = roundIndex === TOTAL_ROUNDS - 1;

    const committed = (commitIds||[]).map(byId).filter(Boolean);
    const spikeSet = new Set(spikeIds||[]);
    let hi = null; committed.forEach(s=>{ if(!hi || s.est>hi.est) hi=s; });

    const working = committed.map(s=>{
      const w = workStory(s, { spiked:spikeSet.has(s.id), cb, isHi: hi && s.id===hi.id });
      return { id:s.id, cost:w.cost, variance:w.variance, value:valueOf(s,cb), blowup:w.blowup, spiked:spikeSet.has(s.id) };
    });

    // §11.6: capacity is a soft budget, not a hard gate — the picker never
    // blocks committing past it (a team can overreach on purpose). bestCompletion
    // still picks the best-value subset that actually fits and finishes
    // (full value, no penalty); anything left over "breaks" — but instead of
    // contributing nothing, it still pays CFG.overrunCredit×value, on top of
    // the flat CFG.brokenPenalty. Overreaching is a real, felt trade, not a
    // wall you can't reach past and not a total loss when it doesn't pay off.
    function evaluate(items, cap){
      const comp = bestCompletion(items, cap);
      const doneIds = new Set(comp.ids);
      const brokenItems = items.filter(it => !doneIds.has(it.id));
      const brokenValue = brokenItems.reduce((a,it)=>a+it.value,0);
      const creditedBrokenValue = brokenValue * CFG.overrunCredit;
      const shipped = comp.rawVal;
      const score = shipped + creditedBrokenValue - CFG.brokenPenalty*brokenItems.length;
      return { comp, doneIds, broken: brokenItems.length, shipped, creditedBrokenValue, usedCost:comp.cost, score };
    }

    // Same-round insurance (§5.3): this is deliberately just evaluate() against
    // the FULL capacity, not against the sum of planned estimates — so idle
    // capacity a team didn't commit elsewhere already absorbs another story's
    // overrun for free, invisibly, before anything below even runs. No separate
    // mechanic needed for that part; what follows just detects it happened so
    // the result screen can say so.
    let outcome = evaluate(working, capacity);

    // Crunch is an unconditional trap: ticking it always grants the extra
    // capacity, always rolls bug risk, and always sets up next round's
    // hangover — whether or not the team actually needed the boost. Gating it
    // on "only if you were already going to miss" (as before) made it a free
    // contingent rescue with no downside; this makes it a real choice.
    let crunched = false, crunchBug = false;
    if (crunch){
      crunched = true;
      capacity = baseCap + CFG.crunchGain;
      crunchBug = d6() <= CFG.crunchBugThreshold;
      outcome = evaluate(working, capacity);
    }

    const roundScore = outcome.score - (crunchBug ? CFG.crunchBugPenalty : 0);
    const brokenIds = working.filter(w=>!outcome.doneIds.has(w.id)).map(w=>w.id);

    // Did idle capacity save a promise that would otherwise have broken? Only
    // meaningful when nothing broke and the team didn't crunch its way there —
    // crunch's extra capacity gets its own, separate call-out. totalVariance is
    // the sum of realized overrun across committed stories; idleGoingIn is the
    // capacity the plan itself left unclaimed (baseCap minus the sum of
    // zero-variance base costs). If idle capacity covered the overrun and
    // nothing broke, that's the save.
    const totalVariance = working.reduce((a,w)=>a+w.variance,0);
    const baseUsed = working.reduce((a,w)=>a+(w.cost-w.variance),0);
    const idleGoingIn = Math.max(0, baseCap - baseUsed);
    const slackSaved = (!crunched && brokenIds.length===0 && totalVariance>0 && idleGoingIn>0)
      ? { idle: idleGoingIn, absorbed: Math.min(idleGoingIn, totalVariance) }
      : undefined;

    // Compounding hangover: crunchStreak counts consecutive rounds crunched
    // (reset to 0 the moment a round passes without crunching). The capacity
    // hit next round scales with it — 1st crunch costs −3, a 2nd in a row
    // costs −6, a 3rd costs −9 — so a team that keeps reaching for it visibly
    // spirals, and a team that stops gets a clean reset.
    const priorStreak = state.crunchStreak || 0;
    const crunchStreak = crunched ? priorStreak + 1 : 0;
    const hangover = CFG.crunchNextPenalty * crunchStreak;

    // Small cross-round slack carry (§5.3): leave enough capacity unused this
    // round with zero broken promises (there's no "target" left to clear —
    // §11.6 — so "cleared cleanly" now means nothing broke) and next round
    // starts with a little extra. Deliberately small and capped — the headline
    // payoff of slack is "didn't lose N," never "gained N"; this just makes the
    // buffer feel slightly tangible across rounds, the way crunch's hangover
    // already carries a cost across rounds.
    const unused = Math.max(0, capacity - outcome.usedCost);
    const idleCarryEarned = (!crunched && outcome.broken===0 && unused >= CFG.slackCarryThreshold)
      ? CFG.slackCarryAmount : 0;

    const nextCarry = isFinal ? 0 : (crunched ? -hangover : idleCarryEarned);
    const finalCrunchPenalty = (crunched && isFinal) ? hangover : 0;
    const cumScore = (state.cumScore||0) + roundScore;

    // combo/tokens/target are gone (§5.4, §11.6) so the only thing left that
    // can still touch the final round's headline score is a crunch taken on
    // that last round — there's no round 5 to carry its hangover into, so
    // it's charged here.
    const endBonus = isFinal ? -finalCrunchPenalty : 0;
    const finalScore = cumScore + endBonus;

    const newState = { carry:nextCarry, cumScore, crunchStreak };
    const log = {
      round: roundIndex+1, cb,
      committed: (commitIds||[]).slice(), spikes: [...spikeSet], crunch,
      costs: working.map(r=>({ id:r.id, cost:r.cost, blowup:r.blowup, spiked:r.spiked, value:r.value })),
      completed: [...outcome.doneIds], broken: brokenIds,
      shipped: outcome.shipped, creditedBrokenValue: outcome.creditedBrokenValue,
      crunched, crunchBug, crunchStreak, nextHangover: (crunched && !isFinal) ? hangover : undefined,
      slackSaved, idleCarryEarned: (idleCarryEarned && !isFinal) ? idleCarryEarned : undefined,
      roundScore, cumScore,
      isFinal, endBonus: isFinal?endBonus:undefined, finalScore: isFinal?finalScore:undefined,
      capacityUsed: outcome.usedCost, capacity,
    };
    return { newState, log };
  }

  let deviceId = null;
  let pollTimer = null;
  let tickTimer = null;
  let currentScreen = null; // { name, teamId }

  const view = document.getElementById('si-view');

  function uid() {
    return 'dev-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function slugify(name) {
    const base = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    return (base || 'team') + '-' + Math.random().toString(36).slice(2, 6);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Local (device-only) storage — never leaves the browser ----------

  function localGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function localSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function localRemove(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  // ---------- Shared storage — backed by /api/kv (Vercel KV) ----------

  async function sharedGet(key) {
    // cache: 'no-store' + a cache-busting param: without this, a GET moments
    // after another device's POST can come back stale (browser or edge cache),
    // which is exactly the shape of "team sees its own submission, host
    // resolves and sees nothing" — the host's read raced a cached response.
    const res = await fetch('/api/kv?key=' + encodeURIComponent(key) + '&_=' + Date.now(), { cache: 'no-store' });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('kv get failed: ' + res.status);
    const data = await res.json();
    return data.value;
  }

  async function sharedSet(key, value) {
    const res = await fetch('/api/kv', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value })
    });
    if (!res.ok) throw new Error('kv set failed: ' + res.status);
  }

  async function sharedDelete(key) {
    try {
      await fetch('/api/kv?key=' + encodeURIComponent(key), { method: 'DELETE' });
    } catch (e) {}
  }

  // ---------- Device identity + cached role ----------

  async function getDeviceId() {
    if (deviceId) return deviceId;
    let id = localGet(DEVICE_ID_KEY);
    if (!id) {
      id = uid();
      localSet(DEVICE_ID_KEY, id);
    }
    deviceId = id;
    return deviceId;
  }

  async function getCachedRole() {
    const raw = localGet(DEVICE_ROLE_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  async function setCachedRole(roleObj) {
    localSet(DEVICE_ROLE_KEY, JSON.stringify(roleObj));
  }

  async function clearCachedRole() {
    localRemove(DEVICE_ROLE_KEY);
  }

  // ---------- Room state ----------

  async function getRoomState() {
    try { return await sharedGet('room:state'); } catch (e) { return null; }
  }

  async function setRoomState(state) {
    await sharedSet('room:state', state);
  }

  async function openRoom() {
    const state = (await getRoomState()) || { phase: 'LOBBY' };
    state.opened = true;
    await setRoomState(state);
    return state;
  }

  async function startCommitRound(roundNum) {
    const state = (await getRoomState()) || { phase: 'LOBBY', opened: true };
    state.opened = true;
    state.phase = 'COMMITTING';
    state.round = roundNum;
    state.deadline = Date.now() + TIMER_SECONDS * 1000;
    await setRoomState(state);
    return state;
  }

  // ---------- Teams ----------

  async function getTeams() {
    try {
      const t = await sharedGet('room:teams');
      return t || [];
    } catch (e) { return []; }
  }

  async function setTeams(teams) {
    await sharedSet('room:teams', teams);
  }

  async function addTeam(name) {
    const teams = await getTeams();
    const team = { id: slugify(name), name: name };
    teams.push(team);
    await setTeams(teams);
    return team;
  }

  async function removeTeam(teamId) {
    const teams = await getTeams();
    const next = teams.filter(t => t.id !== teamId);
    await setTeams(next);
    await sharedDelete('team:' + teamId + ':claim');
  }

  async function renameTeam(teamId, newName) {
    const teams = await getTeams();
    const next = teams.map(t => (t.id === teamId ? { ...t, name: newName } : t));
    await setTeams(next);
  }

  async function getClaim(teamId) {
    try { return await sharedGet('team:' + teamId + ':claim'); } catch (e) { return null; }
  }

  async function setClaim(teamId, dId) {
    await sharedSet('team:' + teamId + ':claim', { deviceId: dId, claimedAt: Date.now() });
  }

  // ---------- Round submissions, per-team state, per-round results ----------

  async function getRoundSubmission(teamId, round) {
    try { return await sharedGet('team:' + teamId + ':round' + round); } catch (e) { return null; }
  }
  async function setRoundSubmission(teamId, round, data) {
    await sharedSet('team:' + teamId + ':round' + round, data);
  }

  // Persistent cross-round state (carry / cumScore / crunchStreak). Sprint
  // model (§5.5): each round has its own independent backlog, so there is
  // nothing like completedAll left to carry between rounds.
  function freshTeamState() { return { carry: 0, cumScore: 0, crunchStreak: 0 }; }
  async function getTeamState(teamId) {
    try { return (await sharedGet('team:' + teamId + ':state')) || freshTeamState(); } catch (e) { return freshTeamState(); }
  }
  async function setTeamState(teamId, st) { await sharedSet('team:' + teamId + ':state', st); }

  // Per-round resolved result (what team + host screens read back).
  async function getResult(teamId, round) {
    try { return await sharedGet('team:' + teamId + ':result' + round); } catch (e) { return null; }
  }
  async function setResult(teamId, round, data) { await sharedSet('team:' + teamId + ':result' + round, data); }

  // Host's device runs the engine for everyone (single-sourced dice).
  // One curveball is locked for the whole round; non-submitters resolve as an
  // empty commit (tagged autoFailed) so they're visibly distinct. Idempotent-ish:
  // only resolves while phase is COMMITTING.
  async function resolveRound(round, teams) {
    const roomState = (await getRoomState()) || { phase: 'COMMITTING', opened: true, round };
    if (roomState.phase !== 'COMMITTING') return roomState; // already resolved
    const roundIndex = round - 1;
    if (!roomState.cbSequence) roomState.cbSequence = generateCurveballSequence();
    const cb = roomState.cbSequence[roundIndex];

    // Retry a null submission once before treating it as "didn't submit" — a
    // single stale/dropped read here silently turns a real commit into an
    // auto-pick (or, before the sharedGet fix above, into an empty one), which
    // is the exact shape of "team sees their own submission, resolve shows
    // nothing shipped." Cheap insurance against one flaky read.
    async function getRoundSubmissionRetried(teamId) {
      const first = await getRoundSubmission(teamId, round);
      if (first) return first;
      await new Promise(r => setTimeout(r, 400));
      return getRoundSubmission(teamId, round);
    }

    const [subs, states] = await Promise.all([
      Promise.all(teams.map(t => getRoundSubmissionRetried(t.id))),
      Promise.all(teams.map(t => getTeamState(t.id))),
    ]);

    await Promise.all(teams.map(async (t, i) => {
      const sub = subs[i];
      let commitIds, spikeIds, crunch, autoPicked = false, autoFailed = false, timedOut = false;
      if (sub) {
        commitIds  = sub.commitIds || [];
        spikeIds   = sub.spikeIds  || [];
        crunch     = !!sub.crunch;
        autoPicked = !!sub.autoPicked;   // team timed out with nothing picked; the client auto-picked for them
        timedOut   = !!sub.timedOut;     // team submitted at the buzzer
      } else if (AUTO_PICK_ENABLED) {
        // No submission at all (never opened the picker / disconnected) — auto-pick
        // a legal plan rather than the old empty-commit auto-fail.
        const auto = autoPickCommit(states[i], roundIndex);
        commitIds  = auto.commitIds;
        spikeIds   = auto.spikeIds;
        crunch     = false;
        autoPicked = commitIds.length > 0;
        autoFailed = commitIds.length === 0; // nothing left to auto-pick (degenerate)
      } else {
        // No submission at all, and auto-pick is off — resolves as an empty
        // commit, same as the pre-auto-pick behavior.
        commitIds  = [];
        spikeIds   = [];
        crunch     = false;
        autoFailed = true;
      }
      const { newState, log } = resolveTeamRound({ commitIds, spikeIds, crunch, cb, roundIndex, state: states[i] });
      log.autoPicked = autoPicked;
      log.autoFailed = autoFailed;
      log.timedOut = timedOut;
      await Promise.all([ setResult(t.id, round, log), setTeamState(t.id, newState) ]);
    }));

    roomState.phase = 'RESOLVED';
    roomState.round = round;
    roomState.lastCb = cb;
    roomState.deadline = null;
    await setRoomState(roomState);
    return roomState;
  }

  // Advance to the next commit round (carry/streak/cumScore persist; each round pulls its own fresh sprint backlog).
  async function startNextRound(teams) {
    const state = (await getRoomState()) || { phase: 'RESOLVED', opened: true, round: 1 };
    const next = (state.round || 1) + 1;
    state.phase = 'COMMITTING';
    state.round = next;
    state.deadline = Date.now() + TIMER_SECONDS * 1000;
    await setRoomState(state);
    return state;
  }

  // Push the shared deadline out (host "+30s"). No-op unless committing.
  async function extendDeadline(seconds) {
    const state = await getRoomState();
    if (!state || state.phase !== 'COMMITTING') return state;
    state.deadline = Math.max(state.deadline || 0, Date.now()) + seconds * 1000;
    await setRoomState(state);
    return state;
  }

  function storyName(id){ const s = byId(id); return s ? s.name : id; }

  // §11.1: curveball reveal, tone-colored, no cute flavor names — just what
  // happened and (via CURVEBALLS' desc text) why it's connected to whatever
  // ran over or under this round.
  function curveballBannerHtml(cbKey){
    const cb = CURVEBALLS[cbKey];
    if (!cb) return '';
    // Deliberately neutral, same label regardless of tone (color still varies).
    // This is one factor that applied to everyone this round — not a verdict on
    // any one team's outcome. A team can still break a promise on a "good"
    // curveball round; that's ordinary variance on a tight commit, unrelated to
    // this. "Something went right/wrong this round" implied otherwise.
    return `<div class="si-curveball tone-${cb.tone}"><span class="si-curveball-title">Update:</span>${escapeHtml(cb.desc)}</div>`;
  }

  // §11.2: broken promises are the central "this is what overreaching costs
  // you" consequence — this needs to be the loudest thing on the screen, not
  // a footnote. Stories still earn partial credit (CFG.overrunCredit) even
  // when broken (§11.6), so this explains the deduction, not a total loss.
  function brokenPromiseBannerHtml(brokenIds){
    if (!brokenIds || !brokenIds.length) return '';
    const n = brokenIds.length;
    const names = brokenIds.map(storyName).join(', ');
    return `<div class="si-broken-banner">
      <p class="si-broken-title">⚠ You broke ${n} promise${n===1?'':'s'}!</p>
      <p class="si-broken-detail">${escapeHtml(names)} didn't fit this round's capacity — docked ${CFG.brokenPenalty*n} point${CFG.brokenPenalty*n===1?'':'s'} total (${CFG.brokenPenalty} each). Still earned partial credit for the work in progress.</p>
    </div>`;
  }
  // score a result row uses for ranking: finalScore on the last round, else running cumScore.
  // Rounded to a whole number — overrunCredit (§11.6) makes the underlying math
  // fractional (and float-imprecise, e.g. 27.2000000000000003), but nobody
  // needs to see that; round once here so display and ranking agree.
  function rowScore(res){
    if (!res) return -Infinity;
    const raw = (res.isFinal && typeof res.finalScore === 'number') ? res.finalScore : res.cumScore;
    return Math.round(raw);
  }

  async function buildHostResultsHtml(round, teams) {
    const results = await Promise.all(teams.map(t => getResult(t.id, round)));
    const rows = teams.map((t, i) => ({ team: t, res: results[i] }));
    const ranked = [...rows].sort((a, b) => rowScore(b.res) - rowScore(a.res));
    const isFinal = rows.some(r => r.res && r.res.isFinal);

    const leaderboardRows = ranked.map((r, i) => {
      const res = r.res;
      const score = res ? rowScore(res) : 0;
      const tag = res && res.autoFailed
        ? '<span class="si-pill">no commit</span>'
        : (res && res.autoPicked
            ? `<span class="si-pill taken si-mono">${score} pt${score === 1 ? '' : 's'} · auto</span>`
            : `<span class="si-pill taken si-mono">${score} pt${score === 1 ? '' : 's'}</span>`);
      // §11.2: broken promises get a loud, unmissable red pill on the leaderboard row.
      const n = (res && !res.autoFailed) ? res.broken.length : 0;
      const brokeTag = n ? ` <span class="si-pill" style="border-color:var(--ember);color:var(--ember);font-weight:700;">⚠ broke ${n}</span>` : '';
      return `<div class="si-team-row si-team-row-fac">
        <span class="si-team-name">${i + 1}. ${escapeHtml(r.team.name)}</span>
        <span class="si-fac-row-actions">${brokeTag}${tag}</span>
      </div>`;
    }).join('');

    const breakdownRows = rows.map(({ team, res }) => {
      if (!res) {
        return `<div class="si-team-row si-team-row-fac"><span class="si-team-name">${escapeHtml(team.name)}</span><span class="si-pill">no record</span></div>`;
      }
      if (res.autoFailed) {
        return `<div class="si-team-row si-team-row-fac"><span class="si-team-name">${escapeHtml(team.name)}</span><span class="si-pill">didn't submit · ${Math.round(res.roundScore)} pts</span></div>`;
      }
      const shipped = res.completed.map(storyName).join(', ') || 'nothing shipped';
      const brokeTxt = res.broken.length ? ` · ⚠ broke ${res.broken.length} (${res.broken.map(storyName).join(', ')})` : '';
      const extras = [
        `shipped value ${res.shipped}`,
        res.creditedBrokenValue ? `+${Math.round(res.creditedBrokenValue)} partial credit` : null,
        // SPIKE (disabled): res.spikes is always empty while SPIKE_ENABLED is
        // false, so this line never renders anything — left as-is, no change needed.
        res.spikes.length ? `spike ×${res.spikes.length}` : null,
        res.crunched ? (res.crunchBug ? 'crunched (bug!)' : 'crunched') : null,
        res.autoPicked ? 'auto-picked' : null,
        res.slackSaved ? 'slack saved it' : null,
      ].filter(Boolean).join(' · ');
      const scoreLabel = (res.isFinal && typeof res.finalScore==='number')
        ? `${Math.round(res.finalScore)} final` : `${Math.round(res.cumScore)} pts`;
      return `<div class="si-team-row si-team-row-fac">
          <span class="si-team-name">${escapeHtml(team.name)}</span>
          <span class="si-pill taken si-mono">${scoreLabel}</span>
        </div>
        <p style="color:var(--fog); font-size:0.78rem; margin:2px 0 10px;">${escapeHtml(shipped)}<br>${escapeHtml(extras)}${res.broken.length ? `<br><span style="color:var(--ember); font-weight:600;">${escapeHtml(brokeTxt.replace(/^ · /, ''))}</span>` : ''}</p>`;
    }).join('');

    const cbKey = (results.find(r => r && r.cb) || {}).cb;
    const cbLine = cbKey ? curveballBannerHtml(cbKey) : '';

    return `
      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:4px;">${isFinal ? 'Final standings' : 'Round ' + round + ' — leaderboard'}</p>
        ${cbLine}
        <div class="si-team-list">${leaderboardRows}</div>
      </div>
      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:12px;">Round ${round} — breakdown</p>
        <div class="si-team-list">${breakdownRows}</div>
      </div>
    `;
  }

  // Clears every team's claim + round submissions, then resets the room to
  // a fresh LOBBY (unopened). If fullWipe is true, the team roster itself
  // is cleared too, so the next class starts from an empty add-team screen.
  // Note: only clears round1 for now — extend this list if/when round 2+
  // submissions exist.
  async function endGame(fullWipe, teams) {
    const rounds = TOTAL_ROUNDS;
    await Promise.all(teams.flatMap(t => {
      const keys = ['team:' + t.id + ':claim', 'team:' + t.id + ':state'];
      for (let r = 1; r <= rounds; r++) {
        keys.push('team:' + t.id + ':round' + r, 'team:' + t.id + ':result' + r);
      }
      return keys.map(k => sharedDelete(k));
    }));
    if (fullWipe) {
      await setTeams([]);
    }
    await setRoomState({ phase: 'LOBBY', opened: false });
  }

  // ---------- Polling ----------

  function stopTicker() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    stopTicker();
  }

  function startPolling(fn) {
    stopPolling();
    pollTimer = setInterval(fn, POLL_MS);
  }

  // 1-second countdown loop, separate from the 2.5s data poll so a screen can run
  // both. startPolling clears it, so any ticker-using screen calls startTicker
  // AFTER startPolling. fn runs immediately then every second; each fn guards on
  // currentScreen and stops itself when it no longer matches.
  function startTicker(fn) {
    stopTicker();
    fn();
    tickTimer = setInterval(fn, 1000);
  }

  function formatClock(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // ---------- Screens ----------

  async function renderLanding() {
    stopPolling();
    currentScreen = { name: 'landing' };
    view.classList.remove('si-projector');
    view.innerHTML = `
      <div class="si-header">
        <p class="si-eyebrow">Ship It — classroom room</p>
        <h1>Join the room</h1>
      </div>
      <div class="si-role-grid">
        <button class="si-role-btn" id="si-join-team">
          <span class="si-role-title">Join as My Team</span>
          <span class="si-role-sub">Pick your team from the roster</span>
        </button>
      </div>
    `;
    document.getElementById('si-join-team').onclick = renderTeamPicker;
  }

  function renderHostPinGate(errorMsg) {
    stopPolling();
    currentScreen = { name: 'host-pin' };
    view.classList.remove('si-projector');
    view.innerHTML = `
      <div class="si-header">
        <p class="si-eyebrow">Host</p>
        <h1>Enter the room PIN</h1>
      </div>
      <div class="si-card">
        <input class="si-pin-input" id="si-pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••" />
        ${errorMsg ? `<p class="si-pin-error">${escapeHtml(errorMsg)}</p>` : ''}
        <div class="si-actions">
          <button class="si-btn si-btn-primary" id="si-pin-submit">Enter</button>
        </div>
      </div>
    `;
    const input = document.getElementById('si-pin-input');
    input.focus();
    const submit = () => checkPin(input.value);
    document.getElementById('si-pin-submit').onclick = submit;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }

  async function checkPin(value) {
    if (value !== HOST_PIN) {
      renderHostPinGate('Wrong PIN — try again.');
      return;
    }
    await joinAsHost();
  }

  async function joinAsHost() {
    let state = await getRoomState();
    if (!state) {
      state = { phase: 'LOBBY', opened: false };
      await setRoomState(state);
    }
    await setCachedRole({ role: 'host', pinPassed: true });
    renderHostDashboard();
  }

  // ---- Host dashboard (roster setup + start room + open round 1) ----
  // (TOTAL_ROUNDS is declared once, near SPRINTS, above.)

  function hostActionHtml(state, teams) {
    if (!state.opened) {
      return `<button class="si-btn si-btn-primary" id="si-start-room" ${teams.length ? '' : 'disabled'}>Start room — open for sign-in</button>`;
    }
    if (state.phase === 'COMMITTING') {
      return `<button class="si-btn si-btn-primary" id="si-resolve-round">Resolve round ${state.round || 1}</button>`;
    }
    if (state.phase === 'RESOLVED') {
      const round = state.round || 1;
      if (round < TOTAL_ROUNDS) {
        return `<button class="si-btn si-btn-primary" id="si-next-round">Open round ${round + 1} — start committing</button>`;
      }
      return `<span class="si-pill open" style="padding:8px 14px;">Game over — final round resolved</span>`;
    }
    return `<span class="si-pill open" style="padding:8px 14px;">Room open</span>
      <button class="si-btn si-btn-primary" id="si-open-round1" ${teams.length ? '' : 'disabled'}>Open Round 1 — start committing</button>`;
  }

  function hostHeadline(state) {
    const round = state.round || 1;
    const isFinal = round >= TOTAL_ROUNDS;
    if (state.phase === 'COMMITTING') return `Round ${round} of ${TOTAL_ROUNDS} — committing`;
    if (state.phase === 'RESOLVED') return isFinal ? 'Final standings' : `Round ${round} — resolved`;
    if (state.opened) return 'Room open for sign-in';
    return 'Setting up the room';
  }

  async function renderHostDashboard() {
    currentScreen = { name: 'host' };
    view.classList.add('si-projector');
    const state = (await getRoomState()) || { phase: 'LOBBY', opened: false };
    const teams = await getTeams();

    view.innerHTML = `
      <div class="si-status-row"><span class="si-status-dot"></span> live · polling every ${POLL_MS / 1000}s</div>
      <div class="si-header">
        <p class="si-eyebrow">Host</p>
        <h1>${hostHeadline(state)}</h1>
      </div>

      ${state.phase === 'COMMITTING' ? `
      <div class="si-card">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px;">
          <div>
            <p class="si-eyebrow" style="margin:0 0 2px;">Time left</p>
            <p class="si-mono si-bignum" id="si-host-timer" style="margin:0; line-height:1;">${formatClock((state.deadline || 0) - Date.now())}</p>
          </div>
          <div style="text-align:right;">
            <p class="si-eyebrow" style="margin:0 0 2px;">Committed</p>
            <p class="si-mono si-bignum" id="si-host-submitted" style="margin:0; line-height:1;">0 / ${teams.length}</p>
          </div>
        </div>
        <div class="si-actions" style="margin-top:14px;">
          <button class="si-btn si-btn-secondary" id="si-add-time">+${TIMER_EXTEND_SECONDS}s</button>
        </div>
      </div>` : ''}

      ${(state.phase !== 'COMMITTING' && state.phase !== 'RESOLVED') ? `
      <div class="si-card" style="text-align:center;">
        <p class="si-eyebrow" style="margin-bottom:12px;">Scan to join</p>
        <div id="si-join-qr" style="display:flex; justify-content:center; margin-bottom:10px;"></div>
        <p class="si-mono" id="si-join-url" style="font-size:0.8rem; word-break:break-all; color:var(--fog); margin:0 0 12px;"></p>
        <button class="si-btn si-btn-secondary" id="si-copy-link">Copy link</button>
      </div>

      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:12px;">Add a team</p>
        <div class="si-add-team-row">
          <input class="si-text-input" id="si-new-team-input" type="text" placeholder="Team name" maxlength="30" />
          <button class="si-btn si-btn-secondary" id="si-add-team-btn">Add</button>
        </div>
      </div>` : ''}

      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:12px;">Roster — <span class="si-mono">${teams.length}</span> team${teams.length === 1 ? '' : 's'}</p>
        <div class="si-team-list" id="si-host-team-list"></div>
      </div>

      ${state.phase === 'RESOLVED' ? '<div id="si-host-results"></div>' : ''}

      <div class="si-actions">
        ${hostActionHtml(state, teams)}
        <button class="si-btn si-btn-ghost" id="si-end-game">End game</button>
      </div>

      <div class="si-footer-note">
        <button class="si-back-link" id="si-back">← leave this view</button>
      </div>
    `;

    document.getElementById('si-back').onclick = renderLanding;

    // Join link points at the plain room URL — no ?role=host — so
    // scanning it never exposes the host entry to students. Only wired
    // pre-game, when the join + add-team cards are actually rendered.
    const joinUrl = location.origin + location.pathname;
    const joinUrlEl = document.getElementById('si-join-url');
    const qrHost = document.getElementById('si-join-qr');
    if (joinUrlEl && qrHost) {
      joinUrlEl.textContent = joinUrl;
      try {
        const qr = qrcode(0, 'M');
        qr.addData(joinUrl);
        qr.make();
        qrHost.innerHTML = qr.createSvgTag({ scalable: true });
        const svgEl = qrHost.querySelector('svg');
        if (svgEl) { svgEl.style.width = '176px'; svgEl.style.height = '176px'; }
      } catch (e) {
        qrHost.innerHTML = `<p style="color:var(--fog); font-size:0.85rem;">QR unavailable — share the link above.</p>`;
      }
      document.getElementById('si-copy-link').onclick = async () => {
        const btn = document.getElementById('si-copy-link');
        try {
          await navigator.clipboard.writeText(joinUrl);
          const prev = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = prev; }, 1500);
        } catch (e) {
          alert('Could not copy automatically — select the link text above and copy it manually.');
        }
      };
    }

    const addTeamBtn = document.getElementById('si-add-team-btn');
    if (addTeamBtn) {
      addTeamBtn.onclick = onAddTeam;
      document.getElementById('si-new-team-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') onAddTeam();
      });
    }

    const startBtn = document.getElementById('si-start-room');
    if (startBtn) {
      startBtn.onclick = async () => {
        await openRoom();
        renderHostDashboard();
      };
    }

    const openRoundBtn = document.getElementById('si-open-round1');
    if (openRoundBtn) {
      openRoundBtn.onclick = async () => {
        await startCommitRound(1);
        renderHostDashboard();
      };
    }

    const resolveBtn = document.getElementById('si-resolve-round');
    if (resolveBtn) {
      resolveBtn.onclick = async () => {
        resolveBtn.disabled = true;
        resolveBtn.textContent = 'Resolving…';
        await resolveRound(state.round || 1, teams);
        renderHostDashboard();
      };
    }

    const nextRoundBtn = document.getElementById('si-next-round');
    if (nextRoundBtn) {
      nextRoundBtn.onclick = async () => {
        await startNextRound(teams);
        renderHostDashboard();
      };
    }

    const endGameBtn = document.getElementById('si-end-game');
    if (endGameBtn) {
      endGameBtn.onclick = async () => {
        const proceed = confirm('End the game and reset the room?');
        if (!proceed) return;
        const fullWipe = confirm('Also clear the team roster?\n\nOK = wipe everything, ready for a new class.\nCancel = keep the same teams, just reset progress for a rematch.');
        await endGame(fullWipe, teams);
        renderHostDashboard();
      };
    }

    await refreshHostTeamList(teams);

    if (state.phase === 'RESOLVED') {
      const resultsEl = document.getElementById('si-host-results');
      if (resultsEl) resultsEl.innerHTML = await buildHostResultsHtml(state.round || 1, teams);
    }

    startPolling(async () => {
      if (currentScreen.name !== 'host') return;
      const t = await getTeams();
      await refreshHostTeamList(t);
    });

    if (state.phase === 'COMMITTING') {
      let facDeadline = state.deadline || (Date.now() + TIMER_SECONDS * 1000);
      const addBtn = document.getElementById('si-add-time');
      if (addBtn) addBtn.onclick = async () => {
        addBtn.disabled = true;
        try { const ns = await extendDeadline(TIMER_EXTEND_SECONDS); if (ns && ns.deadline) facDeadline = ns.deadline; } catch (e) {}
        addBtn.disabled = false;
      };
      startTicker(() => {
        if (currentScreen.name !== 'host') { stopTicker(); return; }
        const el = document.getElementById('si-host-timer');
        if (!el) return;
        const remaining = facDeadline - Date.now();
        el.textContent = formatClock(remaining);
        el.style.color = remaining <= 30000 ? 'var(--ember)' : 'var(--ink)';
      });
    }
  }

  async function onAddTeam() {
    const input = document.getElementById('si-new-team-input');
    const name = input.value.trim();
    if (!name) return;
    input.disabled = true;
    await addTeam(name);
    input.value = '';
    input.disabled = false;
    input.focus();
    renderHostDashboard();
  }

  // During COMMITTING the roster shows who has submitted this round (and updates
  // the #si-host-submitted count) instead of sign-in claim status, so the
  // host can see when it's safe to resolve. Reads room state itself so
  // every caller (poll, rename, add) stays correct without threading args.
  async function refreshHostTeamList(teams) {
    const list = document.getElementById('si-host-team-list');
    const countEl = document.getElementById('si-host-submitted');
    if (!list) return;

    if (!teams.length) {
      list.innerHTML = `<div class="si-empty">No teams on the roster yet — add one above.</div>`;
      if (countEl) countEl.textContent = `0 / 0`;
      return;
    }

    const room = await getRoomState();
    const committing = !!(room && room.phase === 'COMMITTING');
    const round = (room && room.round) || 1;

    let pills;
    if (committing) {
      const subs = await Promise.all(teams.map(t => getRoundSubmission(t.id, round)));
      if (countEl) countEl.textContent = `${subs.filter(Boolean).length} / ${teams.length}`;
      pills = teams.map((t, i) => subs[i]
        ? `<span class="si-pill taken">submitted</span>`
        : `<span class="si-pill open">working…</span>`);
    } else {
      const claims = await Promise.all(teams.map(t => getClaim(t.id)));
      pills = teams.map((t, i) => claims[i]
        ? `<span class="si-pill taken">claimed</span>`
        : `<span class="si-pill open">open</span>`);
    }

    list.innerHTML = teams.map((t, i) => {
      return `<div class="si-team-row si-team-row-fac" data-team-id="${t.id}">
        <span class="si-team-name" data-role="name">${escapeHtml(t.name)}</span>
        <span class="si-fac-row-actions">
          ${pills[i]}
          <button class="si-icon-btn" data-action="rename" title="Rename team">✎</button>
          <button class="si-icon-btn" data-action="remove" title="Remove team">✕</button>
        </span>
      </div>`;
    }).join('');

    teams.forEach(t => {
      const row = list.querySelector(`[data-team-id="${t.id}"]`);
      if (!row) return;
      row.querySelector('[data-action="rename"]').onclick = () => startInlineRename(row, t);
      row.querySelector('[data-action="remove"]').onclick = () => onRemoveTeam(t);
    });
  }

  function startInlineRename(row, team) {
    const nameSpan = row.querySelector('[data-role="name"]');
    const input = document.createElement('input');
    input.className = 'si-text-input-inline';
    input.value = team.name;
    input.maxLength = 30;
    nameSpan.replaceWith(input);
    input.focus();
    input.select();

    let settled = false;
    const commit = async () => {
      if (settled) return;
      settled = true;
      const val = input.value.trim();
      if (val && val !== team.name) {
        await renameTeam(team.id, val);
      }
      const t = await getTeams();
      await refreshHostTeamList(t);
    };
    const cancel = async () => {
      if (settled) return;
      settled = true;
      const t = await getTeams();
      await refreshHostTeamList(t);
    };

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') cancel();
    });
    input.addEventListener('blur', commit);
  }

  async function onRemoveTeam(team) {
    const claim = await getClaim(team.id);
    if (claim) {
      const ok = confirm(`${team.name} has already been claimed by a device. Remove them from the roster anyway?`);
      if (!ok) return;
    }
    await removeTeam(team.id);
    renderHostDashboard();
  }

  // ---- Team join flow ----

  async function renderTeamPicker() {
    currentScreen = { name: 'team-picker' };
    stopPolling();
    view.classList.remove('si-projector');
    const state = await getRoomState();
    const teams = await getTeams();

    if (!state || !state.opened || !teams.length) {
      view.innerHTML = `
        <div class="si-header">
          <p class="si-eyebrow">Join as My Team</p>
          <h1>Waiting for the host to open the room.</h1>
        </div>
        <div class="si-footer-note">
          <button class="si-back-link" id="si-back">← back</button>
        </div>
      `;
      document.getElementById('si-back').onclick = renderLanding;
      startPolling(async () => {
        if (currentScreen.name !== 'team-picker') return;
        const s = await getRoomState();
        const t = await getTeams();
        if (s && s.opened && t.length) renderTeamPicker();
      });
      return;
    }

    view.innerHTML = `
      <div class="si-header">
        <p class="si-eyebrow">Join as My Team</p>
        <h1>Pick your team</h1>
      </div>
      <div class="si-card">
        <div class="si-team-list" id="si-team-picker-list"></div>
      </div>
      <div class="si-footer-note">
        <button class="si-back-link" id="si-back">← back</button>
      </div>
    `;
    document.getElementById('si-back').onclick = renderLanding;
    await renderTeamPickerList(teams);
    startPolling(async () => {
      if (currentScreen.name !== 'team-picker') return;
      const t = await getTeams();
      await renderTeamPickerList(t);
    });
  }

  async function renderTeamPickerList(teams) {
    const list = document.getElementById('si-team-picker-list');
    if (!list) return;
    const claims = await Promise.all(teams.map(t => getClaim(t.id)));
    list.innerHTML = teams.map((t, i) => {
      const claim = claims[i];
      const pill = claim
        ? `<span class="si-pill taken">taken</span>`
        : `<span class="si-pill open">open</span>`;
      return `<button class="si-team-row${claim ? ' claimed' : ''}" data-team-id="${t.id}"><span class="si-team-name">${escapeHtml(t.name)}</span>${pill}</button>`;
    }).join('');
    teams.forEach(t => {
      const el = list.querySelector(`[data-team-id="${t.id}"]`);
      if (el) el.onclick = () => attemptClaim(t);
    });
  }

  async function attemptClaim(team) {
    const dId = await getDeviceId();
    const claim = await getClaim(team.id);
    if (claim && claim.deviceId !== dId) {
      renderOverrideNotice(team, claim);
      return;
    }
    await setClaim(team.id, dId);
    await setCachedRole({ role: 'team', teamId: team.id, teamName: team.name });
    renderTeamEntry(team.id, team.name);
  }

  function renderOverrideNotice(team, claim) {
    view.innerHTML = `
      <div class="si-header">
        <p class="si-eyebrow">Join as My Team</p>
        <h1>${escapeHtml(team.name)}</h1>
      </div>
      <div class="si-notice">
        <div class="si-notice-title">Someone's already playing for this team</div>
        Ask them to hand you the phone, or tap below if that's you on a new device.
      </div>
      <div class="si-actions">
        <button class="si-btn si-btn-primary" id="si-override">That's me — take over</button>
        <button class="si-btn si-btn-secondary" id="si-cancel">Cancel</button>
      </div>
    `;
    document.getElementById('si-override').onclick = async () => {
      const dId = await getDeviceId();
      await setClaim(team.id, dId);
      await setCachedRole({ role: 'team', teamId: team.id, teamName: team.name });
      renderTeamEntry(team.id, team.name);
    };
    document.getElementById('si-cancel').onclick = renderTeamPicker;
  }

  // ---- Team home: routes to waiting / commit picker / submitted based on room phase ----

  async function renderTeamEntry(teamId, teamName) {
    stopPolling();
    view.classList.remove('si-projector');

    // A reset (endGame) always deletes every team's claim, whether or not the
    // host chose a full roster wipe — but it can't touch this device's cached
    // role in localStorage, so without this check a device that was "team a"
    // just keeps confidently showing "You're playing as a" / waiting for the
    // room to reopen, even though its claim on "a" no longer exists and
    // anyone could take that slot first. This also catches the same-team,
    // different-device "take over" flow — if another device claims this team
    // out from under this one, this device gets logged out here too, instead
    // of silently going on thinking it's still in control.
    const myDeviceId = await getDeviceId();
    const claim = await getClaim(teamId);
    if (!claim || claim.deviceId !== myDeviceId) {
      await clearCachedRole();
      renderLanding();
      return;
    }

    const state = await getRoomState();

    if (!state || state.phase === 'LOBBY' || !state.opened) {
      renderTeamWaiting(teamId, teamName, 'Waiting for the host to start Round 1.');
      return;
    }

    // §11.4: a device can still be carrying a cached teamId for a team that no
    // longer exists — e.g. the host did a full-wipe reset and reopened with a
    // brand new roster. The claim check above already catches this in the
    // common case (a wiped team's claim is gone too), but this stays as a
    // second, independent check in case a team is ever removed from the
    // roster without its claim key being cleared.
    const teams = await getTeams();
    if (!teams.some(t => t.id === teamId)) {
      await clearCachedRole();
      renderLanding();
      return;
    }

    const round = state.round || 1;

    if (state.phase === 'COMMITTING') {
      const submission = await getRoundSubmission(teamId, round);
      if (submission) {
        renderTeamSubmitted(teamName, submission);
        return;
      }
      await renderTeamCommitPicker(teamId, teamName, round);
      return;
    }

    if (state.phase === 'RESOLVED') {
      await renderTeamResults(teamId, teamName, round);
      return;
    }

    renderTeamWaiting(teamId, teamName, `Round is ${state.phase.toLowerCase()} — next screens aren't built yet.`);
  }

  function renderTeamWaiting(teamId, teamName, message) {
    currentScreen = { name: 'team-waiting', teamId };
    view.innerHTML = `
      <div class="si-status-row"><span class="si-status-dot"></span> live · polling every ${POLL_MS / 1000}s</div>
      <div class="si-header">
        <p class="si-eyebrow">You're playing as</p>
        <h1 class="si-you-are">${escapeHtml(teamName)}</h1>
      </div>
      <div class="si-card">
        <p style="color:var(--fog); font-size:0.9rem; margin:0;">${escapeHtml(message)}</p>
      </div>
      <div class="si-footer-note">
        <button class="si-back-link" id="si-back">← not my team, go back</button>
      </div>
    `;
    document.getElementById('si-back').onclick = renderTeamPicker;
    startPolling(async () => {
      if (currentScreen.name !== 'team-waiting' || currentScreen.teamId !== teamId) return;
      await renderTeamEntry(teamId, teamName);
    });
  }

  async function renderTeamCommitPicker(teamId, teamName, round) {
    currentScreen = { name: 'team-commit', teamId };
    stopPolling();

    const st = await getTeamState(teamId);
    if (currentScreen.name !== 'team-commit' || currentScreen.teamId !== teamId) return;
    const room = await getRoomState();
    if (currentScreen.name !== 'team-commit' || currentScreen.teamId !== teamId) return;
    let deadline = (room && room.deadline) || (Date.now() + TIMER_SECONDS * 1000);
    const avail = backlogForRound(round - 1); // round is 1-indexed here, backlogForRound wants 0-indexed
    const carry = st.carry || 0;                 // negative after a crunch last round, positive after a big-slack round
    const crunchStreak = st.crunchStreak || 0;    // consecutive rounds crunched so far
    const nextHangover = CFG.crunchNextPenalty * (crunchStreak + 1); // if ticked this round too

    const local = { selected: new Set(), spikes: new Set(), crunch: false, submitting: false, helpOpen: false };

    // §11.6: capacity is a soft budget now, not a hard ceiling the picker
    // enforces — but the number shown should still reflect crunch's boost
    // live, so the color cue (see `over` in draw()) stays accurate the
    // moment crunch is ticked. No explanatory text — the number is the signal.
    function effectiveCapacity(){ return CFG.capacity + carry + (local.crunch ? CFG.crunchGain : 0); }

    const pe = s => s.est;
    function used() {
      let t = 0;
      avail.forEach(s => { if (local.selected.has(s.id)) t += pe(s); });
      // SPIKE (disabled): local.spikes can't gain entries while the toggle
      // below is gated off, so this is already inert — gated too for clarity.
      if (SPIKE_ENABLED) t += local.spikes.size * CFG.spikeCost;
      return t;
    }

    function draw() {
      const t = used();
      const capacity = effectiveCapacity();
      const over = t > capacity;
      view.innerHTML = `
        <div class="si-status-row"><span class="si-status-dot"></span> Time left: <span class="si-mono" id="si-timer" style="font-weight:600; color:${(deadline - Date.now()) <= 30000 ? 'var(--ember)' : 'var(--ink)'};">${formatClock(deadline - Date.now())}</span></div>
        <div class="si-header">
          <p class="si-eyebrow">Round ${round} of ${TOTAL_ROUNDS} — commit</p>
          <h1 class="si-you-are" style="font-size:1.6rem;">${escapeHtml(teamName)}</h1>
        </div>
        <div class="si-card">
          <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
            <p class="si-eyebrow" style="margin:0;">Hour capacity</p>
            <p class="si-mono" style="margin:0; font-weight:600; color:${over ? 'var(--ember)' : 'var(--ink)'};">${t} / ${capacity}</p>
          </div>
          ${carry < 0 ? `<p style="color:var(--ember); font-size:0.8rem; margin:0 0 10px;">Crunch hangover from last round: −${-carry} capacity (normally ${CFG.capacity}).</p>` : ''}
          ${carry > 0 ? `<p style="color:var(--olive); font-size:0.8rem; margin:0 0 10px;">Carried in from leaving capacity unused last round: +${carry} capacity (normally ${CFG.capacity}).</p>` : ''}
          <div class="si-team-list" id="si-backlog-list"></div>
        </div>
        <div class="si-card">
          <div class="si-team-list">
            <div class="si-team-row" id="si-crunch-toggle" style="cursor:pointer;">
              <span class="si-team-name">Crunch <span style="color:var(--fog); font-weight:400; font-size:0.82rem;">— +${CFG.crunchGain} capacity now, a bug risk, and −${nextHangover} capacity next round${crunchStreak > 0 ? ' (streak ' + crunchStreak + ')' : ''}. Applies whether or not you end up needing it.</span></span>
              ${local.crunch ? '<span class="si-pill taken">on</span>' : '<span class="si-pill open">off</span>'}
            </div>
          </div>
        </div>
        <details class="si-help" id="si-help" ${local.helpOpen ? 'open' : ''}>
          <summary>How this works</summary>
          <div class="si-help-body">
            <p><b>Capacity &amp; overdraw.</b> Capacity is a budget, not a hard limit — you can commit past it if you want the extra value badly enough. But real work is uncertain, and whatever doesn't fit once the dice are rolled breaks a promise: it still earns partial credit, not zero, but a lot less than if it had fit, plus a flat penalty per broken promise. Overreach on purpose if you think it's worth the risk — nothing in the app will stop you.</p>
            <p><b>Slack.</b> Capacity you don't commit elsewhere isn't spent on anything — but if a committed story runs over its estimate, that unclaimed capacity absorbs the overrun instead of breaking your commitment. You won't see it happen; you'll only see that nothing broke. Leave enough of it with zero broken promises, and a little carries into next round too.</p>
            ${SPIKE_ENABLED ? `<p><b>Spike (costs ${CFG.spikeCost}).</b> Pay ${CFG.spikeCost} capacity to remove a story's uncertainty — it then costs exactly its estimate, no overrun. You're buying down risk on work you're unsure about.</p>` : ''}
            <p><b>Crunch.</b> Ticking crunch always grants +${CFG.crunchGain} capacity this round — whether you end up needing it or not — but it always carries a bug risk, and the capacity you lose next round grows the more rounds in a row you crunch. Overtime is a loan against your future, and the interest compounds.</p>
            <p><b>Curveballs.</b> Each round a random event may shift some costs or values (big stories cost more, polish worth double, and so on). It's revealed when the round resolves.</p>
          </div>
        </details>
        <div class="si-actions">
          <button class="si-btn si-btn-primary" id="si-submit-commit" ${local.submitting ? 'disabled' : ''}>
            ${local.submitting ? 'Submitting…' : (local.selected.size ? 'Submit commitment' : 'Submit with nothing')}
          </button>
        </div>
        <div class="si-footer-note">
          <button class="si-back-link" id="si-back">← not my team, go back</button>
        </div>
      `;

      const list = document.getElementById('si-backlog-list');
      list.innerHTML = avail.map(s => {
        const isSel = local.selected.has(s.id);
        const isSpiked = local.spikes.has(s.id);
        const est = pe(s);
        // Polish/linked drive curveball effects (pivot doubles polish value,
        // integration discounts linked cost) but were never shown anywhere —
        // a player had no way to tell which stories a curveball even applied
        // to. Small tag here fixes that.
        const tagText = s.polish ? 'polish' : (s.linked ? 'linked' : null);
        const tagHtml = tagText ? ` · <span style="text-transform:uppercase; letter-spacing:0.03em; font-size:0.7rem;">${tagText}</span>` : '';
        // SPIKE (disabled): the toggle pill only renders while SPIKE_ENABLED —
        // a picked story just shows "picked" with no spike affordance.
        const right = isSel
          ? `<span class="si-fac-row-actions">
               ${SPIKE_ENABLED ? `<span class="si-pill${isSpiked ? ' taken' : ''}" data-action="spike" data-story-id="${s.id}" style="cursor:pointer;">${isSpiked ? '🛡 safe' : 'spike +' + CFG.spikeCost}</span>` : ''}
               <span class="si-pill taken">picked</span>
             </span>`
          : `<span class="si-pill open">pick</span>`;
        return `<div class="si-team-row${isSel ? ' claimed' : ''}" data-action="pick" data-story-id="${s.id}">
          <span class="si-team-name" style="flex:1;">
            ${escapeHtml(s.name)}
            <span style="color:var(--fog); font-weight:400; font-size:0.82rem;"> · value ${valueOf(s, null)} · ${est} hour${est===1?'':'s'}${tagHtml}</span>
          </span>
          ${right}
        </div>`;
      }).join('');

      list.querySelectorAll('[data-action="pick"]').forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute('data-story-id');
          if (local.selected.has(id)) { local.selected.delete(id); local.spikes.delete(id); }
          else { local.selected.add(id); } // §11.6: no capacity gate — overreaching is allowed, not blocked
          draw();
        };
      });
      // SPIKE (disabled): no [data-action="spike"] elements exist in the DOM
      // while SPIKE_ENABLED is false (see the backlog row markup above), so
      // this handler has nothing to wire up — gated to match.
      if (SPIKE_ENABLED) list.querySelectorAll('[data-action="spike"]').forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const id = el.getAttribute('data-story-id');
          if (local.spikes.has(id)) local.spikes.delete(id);
          else { local.spikes.add(id); } // §11.6: no capacity gate on spike either
          draw();
        };
      });

      document.getElementById('si-crunch-toggle').onclick = () => { local.crunch = !local.crunch; draw(); };
      const helpEl = document.getElementById('si-help');
      if (helpEl) helpEl.addEventListener('toggle', () => { local.helpOpen = helpEl.open; });
      document.getElementById('si-submit-commit').onclick = () => submit();
      document.getElementById('si-back').onclick = renderTeamPicker;
    }

    async function submit(flags) {
      if (local.submitting) return;
      local.submitting = true;
      draw();
      const payload = {
        teamId, round,
        commitIds: Array.from(local.selected),
        // SPIKE (disabled): local.spikes never gains entries while the toggle
        // is gated off, so this always submits empty — gated explicitly too.
        spikeIds: SPIKE_ENABLED ? Array.from(local.spikes) : [],
        crunch: local.crunch,
        timedOut: !!(flags && flags.timedOut),
        autoPicked: !!(flags && flags.autoPicked),
        submittedAt: Date.now()
      };
      try {
        await setRoundSubmission(teamId, round, payload);
        renderTeamSubmitted(teamName, payload);
      } catch (e) {
        local.submitting = false;
        draw();
        alert('Could not submit — check your connection and try again.');
      }
    }

    // Timer hit zero: lock in whatever's picked. If nothing's picked and
    // auto-pick is on, drop in a legal default so the team takes a real (if
    // unchosen) result; with auto-pick off, they just submit empty-handed.
    function onTimeout() {
      if (local.submitting) return;
      if (local.selected.size > 0) {
        submit({ timedOut: true });
      } else if (AUTO_PICK_ENABLED) {
        const auto = autoPickCommit(st, round - 1);
        local.selected = new Set(auto.commitIds);
        local.spikes = new Set(auto.spikeIds);
        submit({ timedOut: true, autoPicked: local.selected.size > 0 });
      } else {
        submit({ timedOut: true });
      }
    }

    draw();

    startPolling(async () => {
      if (currentScreen.name !== 'team-commit' || currentScreen.teamId !== teamId) return;
      const r = await getRoomState();
      if (!r) return;
      if (r.phase !== 'COMMITTING' || (r.round || 1) !== round) {
        await renderTeamEntry(teamId, teamName); // host resolved / advanced early
        return;
      }
      if (r.deadline && r.deadline !== deadline) deadline = r.deadline; // picked up a +30s extension
    });

    startTicker(() => {
      if (currentScreen.name !== 'team-commit' || currentScreen.teamId !== teamId) { stopTicker(); return; }
      const remaining = deadline - Date.now();
      const el = document.getElementById('si-timer');
      if (el) {
        el.textContent = formatClock(remaining);
        el.style.color = remaining <= 30000 ? 'var(--ember)' : 'var(--ink)';
      }
      if (remaining <= 0) { stopTicker(); onTimeout(); }
    });
  }

  function commitRowsHtml(commitIds, spikeIds) {
    // SPIKE (disabled): spikeIds is always [] while SPIKE_ENABLED is false, so
    // spikeSet is always empty and the tag below never renders — no change needed.
    const spikeSet = new Set(spikeIds || []);
    return (commitIds || []).map(id => {
      const s = byId(id);
      const nm = s ? s.name : id;
      const tag = spikeSet.has(id) ? '<span class="si-pill taken">🛡 spiked</span>' : '';
      return `<div class="si-team-row si-team-row-fac"><span class="si-team-name">${escapeHtml(nm)}</span>${tag}</div>`;
    }).join('');
  }

  async function renderTeamSubmitted(teamName, submission) {
    const teamId = submission.teamId;
    currentScreen = { name: 'team-submitted', teamId };
    stopPolling();
    let deadline = null;
    try { const r0 = await getRoomState(); if (r0) deadline = r0.deadline || null; } catch (e) {}
    if (currentScreen.name !== 'team-submitted' || currentScreen.teamId !== teamId) return;

    // §11.4: this used to only re-check on RESOLVED or a round-number change,
    // so a host reset (room goes back to LOBBY, opened:false) was invisible
    // here — the screen just sat frozen showing a submission for a room that
    // no longer existed, with no back link to escape either. Broadened to
    // catch !opened / non-COMMITTING / any round mismatch, matching how
    // every other team screen already detects a reset.
    startPolling(async () => {
      if (currentScreen.name !== 'team-submitted' || currentScreen.teamId !== teamId) return;
      const s = await getRoomState();
      if (!s) return;
      if (s.deadline) deadline = s.deadline;
      if (!s.opened || s.phase !== 'COMMITTING' || (s.round || 1) !== submission.round) {
        await renderTeamEntry(teamId, teamName);
      }
    });

    const lockedNote = submission.autoPicked
      ? 'Time ran out before you picked — a default plan was locked in for you.'
      : (submission.timedOut ? 'Locked in when the timer hit zero.' : 'Locked until the host resolves the round.');
    const rows = commitRowsHtml(submission.commitIds, submission.spikeIds);
    view.innerHTML = `
      <div class="si-status-row"><span class="si-status-dot"></span> Time left: <span class="si-mono" id="si-timer" style="font-weight:600;">—</span></div>
      <div class="si-header">
        <p class="si-eyebrow">Round ${submission.round} — submitted</p>
        <h1 class="si-you-are" style="font-size:1.6rem;">${escapeHtml(teamName)}</h1>
      </div>
      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:12px;">✓ committed — waiting on the host</p>
        ${(submission.commitIds && submission.commitIds.length)
          ? `<div class="si-team-list">${rows}</div>`
          : `<p style="color:var(--fog); font-size:0.9rem; margin:0;">You committed to nothing this round.</p>`}
        ${submission.crunch ? `<p style="color:var(--fog); font-size:0.85rem; margin-top:14px;">Crunch: on.</p>` : ''}
      </div>
      <div class="si-footer-note">
        <p style="color:var(--fog); font-size:0.8rem; margin:0 0 10px;">${lockedNote}</p>
        <button class="si-back-link" id="si-back">← not my team, go back</button>
      </div>
    `;
    document.getElementById('si-back').onclick = renderTeamPicker;

    startTicker(() => {
      if (currentScreen.name !== 'team-submitted' || currentScreen.teamId !== teamId) { stopTicker(); return; }
      const el = document.getElementById('si-timer');
      if (!el) return;
      if (!deadline) { el.textContent = '—'; return; }
      const remaining = deadline - Date.now();
      el.textContent = remaining <= 0 ? 'time up' : formatClock(remaining);
    });
  }

  // ---- Team results (round RESOLVED — shows only this team's own commitment) ----

  async function renderTeamResults(teamId, teamName, round) {
    currentScreen = { name: 'team-results', teamId };
    stopPolling();
    const res = await getResult(teamId, round);
    if (currentScreen.name !== 'team-results' || currentScreen.teamId !== teamId) return;

    // Rank among all teams this round (§5.6: lead with score AND rank, not
    // just score in isolation). Ties share a rank and are both labeled that
    // way rather than one arbitrarily edging out the other.
    let rankLabel = '';
    try {
      const teams = await getTeams();
      if (currentScreen.name !== 'team-results' || currentScreen.teamId !== teamId) return;
      const allResults = await Promise.all(teams.map(t => getResult(t.id, round)));
      if (currentScreen.name !== 'team-results' || currentScreen.teamId !== teamId) return;
      const scored = teams.map((t, i) => ({ id: t.id, score: rowScore(allResults[i]) })).filter(r => r.score > -Infinity);
      if (scored.length){
        scored.sort((a,b)=>b.score-a.score);
        const myScore = rowScore(res);
        const place = scored.findIndex(r=>r.id===teamId) + 1;
        const tiedCount = scored.filter(r=>r.score===myScore).length;
        const ord = n => (n%10===1&&n%100!==11) ? n+'st' : (n%10===2&&n%100!==12) ? n+'nd' : (n%10===3&&n%100!==13) ? n+'rd' : n+'th';
        if (place > 0) rankLabel = `${tiedCount>1 ? 'tied for ' : ''}${ord(place)} of ${scored.length}`;
      }
    } catch (e) { /* rank is a nice-to-have — if it fails, the score alone still renders below */ }

    // Without this, a team's screen freezes on this round's result forever —
    // nothing else re-checks room state once we're here, so opening the next
    // round on the host's device never reaches players.
    function watchForRoundChange() {
      startPolling(async () => {
        if (currentScreen.name !== 'team-results' || currentScreen.teamId !== teamId) return;
        const s = await getRoomState();
        if (s && (s.phase !== 'RESOLVED' || (s.round || 1) !== round)) {
          await renderTeamEntry(teamId, teamName);
        }
      });
    }

    const header = `
      <div class="si-header">
        <p class="si-eyebrow">${res && res.isFinal ? 'Final result' : 'Round ' + round + ' — resolved'}</p>
        <h1 class="si-you-are" style="font-size:1.6rem;">${escapeHtml(teamName)}</h1>
      </div>`;
    const back = `<div class="si-footer-note"><button class="si-back-link" id="si-back">← not my team, go back</button></div>`;
    const wire = () => { document.getElementById('si-back').onclick = renderTeamPicker; };

    if (!res) {
      view.innerHTML = header + `<div class="si-card"><p style="color:var(--fog); font-size:0.9rem; margin:0;">No result found for this round yet.</p></div>` + back;
      wire(); watchForRoundChange(); return;
    }

    const cbLine = res.cb ? curveballBannerHtml(res.cb) : '';

    if (res.autoFailed) {
      view.innerHTML = header + `
        <div class="si-card">
          ${cbLine}
          <p class="si-eyebrow" style="margin-bottom:8px;">No commitment on record</p>
          <p style="color:var(--fog); font-size:0.9rem; margin:0;">You didn't submit before the round was resolved, and there wasn't enough capacity left to pick anything for you — nothing shipped, zero points this round.</p>
        </div>` + back;
      wire(); watchForRoundChange(); return;
    }

    const bigScore = Math.round(res.isFinal ? res.finalScore : res.cumScore);
    const autoNote = res.autoPicked
      ? `<div class="si-notice"><div class="si-notice-title">Auto-picked</div>No commitment came in before time ran out, so a default plan was chosen for you.</div>`
      : (res.timedOut ? `<div class="si-notice"><div class="si-notice-title">Locked in at the buzzer</div>Your in-progress plan was submitted when the timer hit zero.</div>` : '');
    // §11.6: no target left to clear/miss — just the shipped value itself.
    const shippedPill = `<span class="si-pill open">shipped value: ${res.shipped}</span>`;
    // §11.2: broken promises are the loud, central consequence now — own banner.
    const brokenBanner = brokenPromiseBannerHtml(res.broken);

    const shippedRows = res.completed.length
      ? `<div class="si-team-list">${res.completed.map(id => {
          // SPIKE (disabled): res.spikes is always empty while SPIKE_ENABLED
          // is false, so this badge never renders — no change needed.
          const spiked = res.spikes.includes(id);
          return `<div class="si-team-row si-team-row-fac"><span class="si-team-name">${escapeHtml(storyName(id))}</span>${spiked ? '<span class="si-pill taken">🛡</span>' : ''}</div>`;
        }).join('')}</div>`
      : `<p style="color:var(--fog); font-size:0.9rem; margin:0;">Nothing shipped.</p>`;

    const extraBits = [
      res.creditedBrokenValue ? `Partial credit for broken work: +${Math.round(res.creditedBrokenValue)}` : null,
      res.crunched ? (res.crunchBug ? `Crunched — shipped a bug (−${CFG.crunchBugPenalty})` : 'Crunched for extra capacity') : null,
      (res.crunched && !res.isFinal && res.nextHangover) ? `Hangover next round: −${res.nextHangover} capacity (streak ${res.crunchStreak})` : null,
      res.slackSaved ? `Idle capacity saved you — absorbed ${res.slackSaved.absorbed} of overrun that would've broken a promise` : null,
      (res.idleCarryEarned && !res.isFinal) ? `Left capacity unused — carrying +${res.idleCarryEarned} capacity into next round` : null,
    ].filter(Boolean);
    const extraLine = extraBits.length ? `<p style="color:var(--fog); font-size:0.82rem; margin:10px 0 0;">${extraBits.map(escapeHtml).join('<br>')}</p>` : '';

    view.innerHTML = header + autoNote + `
      <div class="si-card" style="text-align:center;">
        ${cbLine}
        <p class="si-eyebrow" style="margin-bottom:2px;">${res.isFinal ? 'Final score' : 'Score so far'}</p>
        <p class="si-mono" style="font-size:2.6rem; font-weight:600; margin:0 0 4px;">${bigScore}</p>
        ${rankLabel ? `<p style="color:var(--fog); font-size:0.85rem; margin:0 0 8px;">${escapeHtml(rankLabel)}</p>` : ''}
        ${shippedPill}
      </div>
      ${brokenBanner}
      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:12px;">Shipped this round</p>
        ${shippedRows}
        ${extraLine}
      </div>` + back;
    wire();
    watchForRoundChange();
  }

  // ---------- Dev reset ----------

  document.getElementById('si-dev-reset').onclick = async () => {
    await clearCachedRole();
    renderLanding();
  };

  // ---------- Boot ----------

  (async function boot() {
    await getDeviceId();
    const params = new URLSearchParams(window.location.search);
    // Backward compat: this session renamed facilitator -> host (§11.3). A
    // device that already passed the PIN gate before that rename has
    // role:'facilitator' cached in localStorage, and anyone with the old
    // ?role=facilitator link bookmarked would otherwise silently lose host
    // access — no error, just dropped to the normal landing screen, which
    // is exactly what "host login is broken" looks like from the outside.
    // Accept both spellings on read; every new write already uses 'host'.
    const wantsHost = params.get('role') === 'host' || params.get('role') === 'facilitator';
    const cached = await getCachedRole();
    const cachedIsHost = !!(cached && (cached.role === 'host' || cached.role === 'facilitator') && cached.pinPassed);

    if (wantsHost) {
      if (cachedIsHost) {
        renderHostDashboard();
      } else {
        renderHostPinGate();
      }
      return;
    }

    if (cachedIsHost) {
      renderHostDashboard();
    } else if (cached && cached.role === 'team') {
      renderTeamEntry(cached.teamId, cached.teamName);
    } else {
      renderLanding();
    }
  })();
})();
</script>
</body>
</html>
