<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Ship It</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap');

:root {
  --paper: #FAF8F2;
  --bone: #F4F1EA;
  --rule: #DAD4C4;
  --rule-soft: #E8E2D2;
  --ink: #0E1116;
  --fog: #6E7889;
  --ember: #C84A1F;
  --ember-soft: #F2D9CC;
  --olive: #6B7B4F;
  --olive-soft: #e8ece3;
  --indigo: #2C3E6E;
  --indigo-soft: rgba(44, 62, 110, 0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-input: inset 0 1px 2px rgba(14, 17, 22, 0.04);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

.si-app {
  font-family: 'Inter Tight', sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  min-height: 100vh;
  padding: 32px 20px 60px;
}

.si-app h1, .si-app h2, .si-app h3 {
  font-family: 'Newsreader', serif;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.01em;
}

.si-mono {
  font-family: 'JetBrains Mono', monospace;
  font-variant-numeric: tabular-nums;
}

.si-wrap {
  max-width: 560px;
  margin: 0 auto;
}

.si-eyebrow {
  color: var(--fog);
  font-size: 0.85rem;
  margin: 0 0 6px;
}

.si-header h1 {
  font-size: 1.9rem;
  line-height: 1.15;
}

.si-header {
  margin-bottom: 28px;
}

.si-card {
  background: var(--bone);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 24px;
}

.si-card + .si-card { margin-top: 20px; }

/* landing */
.si-role-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.si-role-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  width: 100%;
  text-align: left;
  padding: 20px 22px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule);
  background: var(--paper);
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .05s;
  font-family: inherit;
}

.si-role-btn:hover { border-color: var(--indigo); background: var(--indigo-soft); }
.si-role-btn:active { transform: translateY(1px); }

.si-role-btn .si-role-title {
  font-family: 'Newsreader', serif;
  font-size: 1.25rem;
  font-weight: 600;
}

.si-role-btn .si-role-sub {
  color: var(--fog);
  font-size: 0.85rem;
}

/* team list */
.si-team-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.si-team-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule);
  background: var(--paper);
  cursor: pointer;
  transition: border-color .15s, background .15s;
  font-family: inherit;
  width: 100%;
  text-align: left;
}

.si-team-row:hover { border-color: var(--indigo); }
.si-team-row.claimed { background: var(--bone); }
.si-team-row:disabled { opacity: 0.4; cursor: not-allowed; }
.si-team-row:disabled:hover { border-color: var(--rule); }

.si-team-row-fac {
  cursor: default;
}
.si-team-row-fac:hover { border-color: var(--rule); }

.si-team-name {
  font-weight: 600;
  font-size: 1rem;
}

.si-fac-row-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.si-icon-btn {
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--fog);
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1;
  padding: 0;
}
.si-icon-btn:hover { color: var(--ink); border-color: var(--fog); }

.si-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 0.72rem;
  font-weight: 600;
  border: 1px solid var(--rule);
  color: var(--fog);
  flex-shrink: 0;
}

.si-pill.open { border-color: var(--olive); color: var(--olive); background: var(--olive-soft); }
.si-pill.taken { border-color: var(--fog); color: var(--fog); }

.si-empty {
  text-align: center;
  color: var(--fog);
  font-size: 0.9rem;
  padding: 20px 0;
}

/* buttons */
.si-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  border: none;
  transition: transform .05s, opacity .15s, background .15s;
}
.si-btn:active { transform: translateY(1px); }
.si-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.si-btn:disabled:active { transform: none; }
.si-btn-primary { background: var(--ember); color: #fff; }
.si-btn-primary:hover:not(:disabled) { background: #a83c18; }
.si-btn-secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--rule); }
.si-btn-secondary:hover:not(:disabled) { background: var(--bone); border-color: var(--fog); }
.si-btn-ghost { background: transparent; color: var(--fog); border: 1px solid var(--rule); font-weight: 500; }
.si-btn-ghost:hover { color: var(--ink); border-color: var(--fog); }

.si-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  align-items: center;
  flex-wrap: wrap;
}

/* roster editor */
.si-add-team-row {
  display: flex;
  gap: 10px;
}

.si-text-input {
  flex: 1;
  padding: 11px 14px;
  font-size: 0.95rem;
  font-family: inherit;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
  box-shadow: var(--shadow-input);
}
.si-text-input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }

.si-text-input-inline {
  flex: 1;
  padding: 4px 8px;
  font-size: 1rem;
  font-weight: 600;
  font-family: inherit;
  border: 1px solid var(--indigo);
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink);
}
.si-text-input-inline:focus { outline: none; }

/* claim banner */
.si-notice {
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--ember);
  background: var(--ember-soft);
  color: var(--ink);
  font-size: 0.88rem;
  margin-bottom: 16px;
}

.si-notice .si-notice-title { font-weight: 600; margin-bottom: 4px; }

/* curveball reveal — tone-colored, no cute flavor names (§11.1) */
.si-curveball {
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule);
  font-size: 0.88rem;
  line-height: 1.5;
  margin-bottom: 16px;
}
.si-curveball .si-curveball-title { font-weight: 600; display: block; margin-bottom: 4px; }
.si-curveball.tone-bad { border-color: var(--ember); background: var(--ember-soft); }
.si-curveball.tone-good { border-color: var(--olive); background: var(--olive-soft); }
.si-curveball.tone-neutral { border-color: var(--rule); background: var(--bone); }

/* broken-promise callout — deliberately the loudest thing on the screen when
   it applies (§11.2): this is the central consequence the whole game teaches. */
.si-broken-banner {
  padding: 16px 18px;
  border-radius: var(--radius);
  border: 2px solid var(--ember);
  background: var(--ember-soft);
  text-align: center;
  margin-bottom: 16px;
}
.si-broken-banner .si-broken-title {
  font-family: 'Newsreader', serif;
  font-weight: 600;
  font-size: 1.3rem;
  color: var(--ember);
  margin: 0 0 6px;
}
.si-broken-banner .si-broken-detail { font-size: 0.85rem; color: var(--ink); margin: 0; }

/* status row */
.si-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fog);
  font-size: 0.8rem;
  margin-bottom: 18px;
}

.si-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--olive);
  flex-shrink: 0;
}

/* team view */
.si-you-are {
  font-family: 'Newsreader', serif;
  font-size: 2rem;
  font-weight: 600;
  margin: 4px 0 0;
}

.si-footer-note {
  margin-top: 28px;
  text-align: center;
}

.si-back-link {
  background: none;
  border: none;
  color: var(--fog);
  font-size: 0.8rem;
  cursor: pointer;
  text-decoration: underline dotted var(--rule);
  text-underline-offset: 3px;
  font-family: inherit;
  padding: 4px;
}
.si-back-link:hover { color: var(--ink); }

.si-pin-input {
  width: 100%;
  padding: 14px 16px;
  font-size: 1.6rem;
  letter-spacing: 0.4em;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
  box-shadow: var(--shadow-input);
}
.si-pin-input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }

.si-pin-error {
  color: var(--ember);
  font-size: 0.85rem;
  margin: 10px 0 0;
}

.si-dev-reset {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font-size: 0.7rem;
  padding: 6px 10px;
  border-radius: 100px;
  border: 1px solid var(--rule);
  background: var(--bone);
  color: var(--fog);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  opacity: 0.6;
}
.si-dev-reset:hover { opacity: 1; }

/* Big numbers (host timer + committed count). Base size works on a
   phone; projector mode scales them up below. */
.si-bignum { font-size: 1.8rem; font-weight: 600; }

/* Projector mode — added to #si-view only on the host dashboard, and the
   layout changes are gated to wide screens so a host on a phone still
   gets the plain mobile column. The leaderboard is the hero during results. */
@media (min-width: 820px) {
  #si-view.si-projector { max-width: 940px; }
  .si-projector .si-header h1 { font-size: 2.9rem; }
  .si-projector .si-bignum { font-size: 3.4rem; }
  .si-projector #si-host-results .si-eyebrow { font-size: 1.05rem; }
  .si-projector #si-host-results .si-team-name { font-size: 1.5rem; }
  .si-projector #si-host-results .si-team-row { padding: 18px 22px; }
  .si-projector #si-host-results .si-pill { font-size: 0.95rem; padding: 5px 14px; }
  .si-projector #si-host-team-list .si-team-name { font-size: 1.2rem; }
  .si-projector #si-host-team-list .si-pill { font-size: 0.82rem; }
}

/* Collapsible "How this works" on the commit screen */
.si-help {
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--paper);
  padding: 0 16px;
  margin-top: 12px;
}
.si-help summary {
  cursor: pointer;
  padding: 12px 0;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--ink);
  list-style: none;
}
.si-help summary::-webkit-details-marker { display: none; }
.si-help summary::before { content: '▸ '; color: var(--fog); }
.si-help[open] summary::before { content: '▾ '; }
.si-help-body { padding-bottom: 14px; }
.si-help-body p { margin: 0 0 10px; font-size: 0.83rem; color: var(--fog); line-height: 1.5; }
.si-help-body p:last-child { margin-bottom: 0; }
.si-help-body b { color: var(--ink); }
</style>
</head>
<body>
<div id="shipit-root">
  <div class="si-app">
    <div class="si-wrap" id="si-view"></div>
  </div>
  <button class="si-dev-reset" id="si-dev-reset" title="Clear this device's cached role (testing only)">clear local role</button>
</div>

<script>
/* Vendored: qrcode-generator v2.0.4 (MIT, Kazuhiko Arase) — no CDN dependency, so sign-up still works if the venue wifi is flaky. */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

  // it earns nothing more), crunch as an unconditional/compounding trap,
  // slack as same-round insurance against overruns, 4 rounds each with its
  // own sprint backlog. Spike is built but disabled — see SPIKE_ENABLED.
  // Teams submit commit/crunch; the host's device runs
  // resolveTeamRound() for everyone so dice are single-sourced.
  // ============================================================
  // Sprint model (§5.5): each round is its own sprint with a small, independent
  // backlog — no story carries between rounds, so story IDs are globally unique
  // (round-prefixed) and there is no cross-round completion state to track.
  // §11.5: value density climbs with risk tier (safe < mid < big) so bigger,

  const SPRINTS = [

      { id:'R3-S2', name:'Wishlist',                      val:2,  est:2 },
      { id:'R3-S3', name:'Loyalty points program',        val:10, est:6, linked:true },

      { id:'R3-S6', name:'Dark mode / theming',           val:1,  est:1, polish:true },
