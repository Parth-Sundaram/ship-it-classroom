<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Ship It</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap');

:root {
  --paper: #FAF8F2;
  --bone: #F4F1EA;
  --rule: #DAD4C4;
  --rule-soft: #E8E2D2;
  --ink: #0E1116;
  --fog: #6E7889;
  --ember: #C84A1F;
  --ember-soft: #F2D9CC;
  --olive: #6B7B4F;
  --olive-soft: #e8ece3;
  --indigo: #2C3E6E;
  --indigo-soft: rgba(44, 62, 110, 0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-input: inset 0 1px 2px rgba(14, 17, 22, 0.04);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

.si-app {
  font-family: 'Inter Tight', sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  min-height: 100vh;
  padding: 32px 20px 60px;
}

.si-app h1, .si-app h2, .si-app h3 {
  font-family: 'Newsreader', serif;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.01em;
}

.si-mono {
  font-family: 'JetBrains Mono', monospace;
  font-variant-numeric: tabular-nums;
}

.si-wrap {
  max-width: 560px;
  margin: 0 auto;
}

.si-eyebrow {
  color: var(--fog);
  font-size: 0.85rem;
  margin: 0 0 6px;
}

.si-header h1 {
  font-size: 1.9rem;
  line-height: 1.15;
}

.si-header {
  margin-bottom: 28px;
}

.si-card {
  background: var(--bone);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 24px;
}

.si-card + .si-card { margin-top: 20px; }

/* landing */
.si-role-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.si-role-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  width: 100%;
  text-align: left;
  padding: 20px 22px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule);
  background: var(--paper);
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .05s;
  font-family: inherit;
}

.si-role-btn:hover { border-color: var(--indigo); background: var(--indigo-soft); }
.si-role-btn:active { transform: translateY(1px); }

.si-role-btn .si-role-title {
  font-family: 'Newsreader', serif;
  font-size: 1.25rem;
  font-weight: 600;
}

.si-role-btn .si-role-sub {
  color: var(--fog);
  font-size: 0.85rem;
}

/* team list */
.si-team-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.si-team-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule);
  background: var(--paper);
  cursor: pointer;
  transition: border-color .15s, background .15s;
  font-family: inherit;
  width: 100%;
  text-align: left;
}

.si-team-row:hover { border-color: var(--indigo); }
.si-team-row.claimed { background: var(--bone); }
.si-team-row:disabled { opacity: 0.4; cursor: not-allowed; }
.si-team-row:disabled:hover { border-color: var(--rule); }

.si-team-row-fac {
  cursor: default;
}
.si-team-row-fac:hover { border-color: var(--rule); }

.si-team-name {
  font-weight: 600;
  font-size: 1rem;
}

.si-fac-row-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.si-icon-btn {
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--fog);
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1;
  padding: 0;
}
.si-icon-btn:hover { color: var(--ink); border-color: var(--fog); }

.si-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 0.72rem;
  font-weight: 600;
  border: 1px solid var(--rule);
  color: var(--fog);
  flex-shrink: 0;
}

.si-pill.open { border-color: var(--olive); color: var(--olive); background: var(--olive-soft); }
.si-pill.taken { border-color: var(--fog); color: var(--fog); }

.si-empty {
  text-align: center;
  color: var(--fog);
  font-size: 0.9rem;
  padding: 20px 0;
}

/* buttons */
.si-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  border: none;
  transition: transform .05s, opacity .15s, background .15s;
}
.si-btn:active { transform: translateY(1px); }
.si-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.si-btn:disabled:active { transform: none; }
.si-btn-primary { background: var(--ember); color: #fff; }
.si-btn-primary:hover:not(:disabled) { background: #a83c18; }
.si-btn-secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--rule); }
.si-btn-secondary:hover:not(:disabled) { background: var(--bone); border-color: var(--fog); }
.si-btn-ghost { background: transparent; color: var(--fog); border: 1px solid var(--rule); font-weight: 500; }
.si-btn-ghost:hover { color: var(--ink); border-color: var(--fog); }

.si-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  align-items: center;
  flex-wrap: wrap;
}

/* roster editor */
.si-add-team-row {
  display: flex;
  gap: 10px;
}

.si-text-input {
  flex: 1;
  padding: 11px 14px;
  font-size: 0.95rem;
  font-family: inherit;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
  box-shadow: var(--shadow-input);
}
.si-text-input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }

.si-text-input-inline {
  flex: 1;
  padding: 4px 8px;
  font-size: 1rem;
  font-weight: 600;
  font-family: inherit;
  border: 1px solid var(--indigo);
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink);
}
.si-text-input-inline:focus { outline: none; }

/* claim banner */
.si-notice {
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--ember);
  background: var(--ember-soft);
  color: var(--ink);
  font-size: 0.88rem;
  margin-bottom: 16px;
}

.si-notice .si-notice-title { font-weight: 600; margin-bottom: 4px; }

/* status row */
.si-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fog);
  font-size: 0.8rem;
  margin-bottom: 18px;
}

.si-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--olive);
  flex-shrink: 0;
}

/* team view */
.si-you-are {
  font-family: 'Newsreader', serif;
  font-size: 2rem;
  font-weight: 600;
  margin: 4px 0 0;
}

.si-footer-note {
  margin-top: 28px;
  text-align: center;
}

.si-back-link {
  background: none;
  border: none;
  color: var(--fog);
  font-size: 0.8rem;
  cursor: pointer;
  text-decoration: underline dotted var(--rule);
  text-underline-offset: 3px;
  font-family: inherit;
  padding: 4px;
}
.si-back-link:hover { color: var(--ink); }

.si-pin-input {
  width: 100%;
  padding: 14px 16px;
  font-size: 1.6rem;
  letter-spacing: 0.4em;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
  box-shadow: var(--shadow-input);
}
.si-pin-input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }

.si-pin-error {
  color: var(--ember);
  font-size: 0.85rem;
  margin: 10px 0 0;
}

.si-dev-reset {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font-size: 0.7rem;
  padding: 6px 10px;
  border-radius: 100px;
  border: 1px solid var(--rule);
  background: var(--bone);
  color: var(--fog);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  opacity: 0.6;
}
.si-dev-reset:hover { opacity: 1; }
</style>
</head>
<body>
<div id="shipit-root">
  <div class="si-app">
    <div class="si-wrap" id="si-view"></div>
  </div>
  <button class="si-dev-reset" id="si-dev-reset" title="Clear this device's cached role (testing only)">clear local role</button>
</div>

<script>
(function () {
  const DEVICE_ID_KEY = 'device:id';
  const DEVICE_ROLE_KEY = 'device:role';
  const POLL_MS = 2500;
  const FACILITATOR_PIN = '2358';

  // ============================================================
  // Ship It — real engine (tuned v2, human-input port).
  // Teams submit commit/spike/crunch; the facilitator's device runs
  // resolveTeamRound() for everyone so dice are single-sourced.
  // ============================================================
  const BACKLOG = [
    { id:'S1',  name:'User accounts',         val:4,  est:3, enabler:true },
    { id:'S2',  name:'Product search',        val:7,  est:5 },
    { id:'S3',  name:'Cart & checkout',       val:8,  est:6, combo:true },
    { id:'S4',  name:'Recommendation engine', val:10, est:8 },
    { id:'S5',  name:'Ratings & reviews',     val:3,  est:2, polish:true },
    { id:'S6',  name:'Order history',         val:4,  est:4, combo:true, enablerBenefit:true },
    { id:'S7',  name:'Wishlist',              val:2,  est:2, polish:true },
    { id:'S8',  name:'Admin dashboard',       val:5,  est:5, enablerBenefit:true },
    { id:'S9',  name:'One-click reorder',     val:5,  est:3, combo:true },
    { id:'S10', name:'Polish / dark mode',    val:2,  est:1, polish:true },
  ];
  const CFG = {
    capacity:20,
    targets:[13,15],                 // release target (shipped value) per round; length = # rounds
    missPenalty:8,
    surplusRate:0.8, surplusCap:12,
    brokenPenalty:2,
    comboBonus:10, comboIds:['S3','S6','S9'],
    spikeCost:1,
    crunchGain:3, crunchNextPenalty:3, crunchBugPenalty:3, crunchBugThreshold:3,
    midHi:1, midMax:2, bigHi:2, bigMax:4,
    enablerDiscount:2, enablerMode:'estimate',
    slackPerToken:3, tokenEndValue:1,
    trust:true,
  };
  const CURVEBALLS = {
    none:        { label:'Calm sprint',     desc:'No curveball this round.' },
    security:    { label:'Security review',  desc:'Big stories (est 6+) cost +2 — extra hardening.' },
    pivot:       { label:'Priority pivot',   desc:'Polish stories are worth double value this round.' },
    integration: { label:'Integration help', desc:'Combo stories cost −1 — the infra came together.' },
    turnover:    { label:'Team turnover',    desc:'Your single biggest story costs +2 — someone left.' },
  };
  const CB_KEYS = ['security','pivot','integration','turnover','none'];
  function randomCurveball(){ return CB_KEYS[Math.floor(Math.random()*CB_KEYS.length)]; }

  function byId(id){ return BACKLOG.find(s => s.id === id); }
  function d6(){ return 1 + Math.floor(Math.random()*6); }
  function planEst(s, s1Done){
    let e = s.est;
    if (CFG.enablerMode==='estimate' && s.enablerBenefit && s1Done) e = Math.max(0, e - CFG.enablerDiscount);
    return e;
  }
  function tierEst(s, s1Done){ return CFG.enablerMode==='estimate' ? planEst(s, s1Done) : s.est; }
  function tierOf(e){ return e<=2 ? 'safe' : (e<=5 ? 'mid' : 'big'); }
  function valueOf(s, cb){ return (cb==='pivot' && s.polish) ? s.val*2 : s.val; }

  function workStory(s, { spiked, s1Done, cb, isHi }){
    const tier = tierOf(tierEst(s, s1Done));
    let base = planEst(s, s1Done);
    let variance = 0, blowup = false;
    if (!spiked && tier!=='safe'){
      const r = d6();
      if (tier==='mid') variance = r<=3?0:(r<=5?CFG.midHi:CFG.midMax);
      else              variance = r<=3?0:(r<=5?CFG.bigHi:CFG.bigMax);
      blowup = (tier==='big' && r===6);
    }
    let cost = base + variance, cbMod = 0;
    if (cb==='security' && s.est>=6) cbMod += 2;
    if (cb==='integration' && s.combo) cbMod -= 1;
    if (cb==='turnover' && isHi) cbMod += 2;
    cost += cbMod;
    if (spiked) cost += CFG.spikeCost;
    return { cost: Math.max(0,cost), variance, blowup };
  }
  function bestCompletion(items, capacity){
    const n = items.length; let best = { ids:[], rawVal:0, cost:0, score:-Infinity };
    for (let m=0; m<(1<<n); m++){
      let cost=0, val=0, ids=[];
      for (let i=0;i<n;i++) if (m&(1<<i)){ cost+=items[i].cost; val+=items[i].value; ids.push(items[i].id); }
      if (cost<=capacity){ const score = val - CFG.brokenPenalty*(n-ids.length); if (score>best.score) best={ids,rawVal:val,cost,score}; }
    }
    if (best.score===-Infinity) best={ids:[],rawVal:0,cost:0,score:0};
    return best;
  }
  function availableStories(completedAll){
    const done = new Set(completedAll || []);
    return BACKLOG.filter(s => !done.has(s.id));
  }

  // Resolve one team's round from human inputs.
  // state = { completedAll:[], carry, trustAvail, tokens, cumScore }
  function resolveTeamRound({ commitIds, spikeIds, crunch, cb, roundIndex, state }){
    const completedAll = new Set(state.completedAll || []);
    const s1Done = completedAll.has('S1');
    const baseCap = CFG.capacity + (state.carry||0);
    let capacity = baseCap;
    const target = CFG.targets[roundIndex];
    const isFinal = roundIndex === CFG.targets.length - 1;
    const tokensIn = state.tokens || 0;

    const committed = (commitIds||[]).map(byId).filter(Boolean);
    const spikeSet = new Set(spikeIds||[]);
    let hi = null; committed.forEach(s=>{ if(!hi || s.est>hi.est) hi=s; });

    let rolled = committed.map(s=>{
      const w = workStory(s, { spiked:spikeSet.has(s.id), s1Done, cb, isHi: hi && s.id===hi.id });
      return { id:s.id, cost:w.cost, variance:w.variance, value:valueOf(s,cb), blowup:w.blowup, spiked:spikeSet.has(s.id) };
    });

    let trustDropped = null, working = rolled.slice();
    if (CFG.trust && state.trustAvail && roundIndex>0){
      if (working.reduce((a,b)=>a+b.cost,0) > capacity){
        const b0 = bestCompletion(working, capacity);
        let bestS = b0.rawVal - CFG.brokenPenalty*(working.length-b0.ids.length), drop=null;
        for (const c of working){
          const rest = working.filter(x=>x.id!==c.id);
          const bc = bestCompletion(rest, capacity);
          const sc = bc.rawVal - CFG.brokenPenalty*(rest.length-bc.ids.length);
          if (sc>bestS){ bestS=sc; drop=c.id; }
        }
        if (drop){ trustDropped=drop; working = working.filter(x=>x.id!==drop); }
      }
    }

    function evaluate(items, cap){
      const comp = bestCompletion(items, cap);
      const doneIds = new Set(comp.ids);
      const broken = items.length - doneIds.size;
      const shipped = comp.rawVal;
      const hitTarget = shipped >= target;
      const surplus = hitTarget ? Math.min(CFG.surplusCap, Math.floor((shipped-target)*CFG.surplusRate)) : 0;
      const miss = hitTarget ? 0 : CFG.missPenalty;
      const score = comp.rawVal - CFG.brokenPenalty*broken + surplus - miss;
      return { comp, doneIds, broken, shipped, hitTarget, surplus, miss, usedCost:comp.cost, score };
    }
    function absorb(items, k){
      const idx = items.map((it,i)=>[i,it.variance]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,k).map(x=>x[0]);
      return items.map((it,i)=> idx.includes(i) ? {...it, cost:it.cost-it.variance, variance:0} : it);
    }
    let bestOutcome = evaluate(working, capacity), bestK = 0;
    for (let k=1; k<=tokensIn; k++){
      const o = evaluate(absorb(working,k), capacity);
      const net = o.score - k*CFG.tokenEndValue, cur = bestOutcome.score - bestK*CFG.tokenEndValue;
      if (net>cur){ bestOutcome=o; bestK=k; }
    }
    let outcome = bestOutcome, spent = bestK;
    const workingUsed = absorb(working, bestK);

    let crunched = false, crunchBug = false;
    if (crunch && (!outcome.hitTarget || outcome.broken>0)){
      crunched = true;
      capacity = baseCap + CFG.crunchGain;
      crunchBug = d6() <= CFG.crunchBugThreshold;
      outcome = evaluate(workingUsed, capacity);
    }

    outcome.doneIds.forEach(id=>completedAll.add(id));

    const unused = Math.max(0, capacity - outcome.usedCost);
    const gained = (crunched || !outcome.hitTarget) ? 0 : Math.floor(unused / CFG.slackPerToken);
    const tokensOut = tokensIn - spent + gained;

    const roundScore = outcome.score - (crunchBug ? CFG.crunchBugPenalty : 0);
    const brokenIds = working.filter(w=>!outcome.doneIds.has(w.id)).map(w=>w.id);
    const nextCarry = (crunched && !isFinal) ? -CFG.crunchNextPenalty : 0;
    const finalCrunchPenalty = (crunched && isFinal) ? CFG.crunchNextPenalty : 0;
    const nextTrust = outcome.hitTarget && brokenIds.length===0;
    const cumScore = (state.cumScore||0) + roundScore;

    const combo = CFG.comboIds.every(id=>completedAll.has(id));
    const endBonus = isFinal ? ((combo?CFG.comboBonus:0) + tokensOut*CFG.tokenEndValue - finalCrunchPenalty) : 0;
    const finalScore = cumScore + endBonus;

    const newState = { completedAll:[...completedAll], carry:nextCarry, trustAvail:nextTrust, tokens:tokensOut, cumScore };
    const log = {
      round: roundIndex+1, cb, target,
      committed: (commitIds||[]).slice(), spikes: [...spikeSet], crunch,
      costs: rolled.map(r=>({ id:r.id, cost:r.cost, blowup:r.blowup, spiked:r.spiked, value:r.value })),
      completed: [...outcome.doneIds], broken: brokenIds, trustDropped,
      shipped: outcome.shipped, hitTarget: outcome.hitTarget, surplus: outcome.surplus, miss: outcome.miss,
      crunched, crunchBug, tokensSpent: spent, tokensGained: gained, tokensOut,
      roundScore, cumScore,
      isFinal, combo: isFinal?combo:undefined, endBonus: isFinal?endBonus:undefined, finalScore: isFinal?finalScore:undefined,
      capacityUsed: outcome.usedCost, capacity,
    };
    return { newState, log };
  }

  let deviceId = null;
  let pollTimer = null;
  let currentScreen = null; // { name, teamId }

  const view = document.getElementById('si-view');

  function uid() {
    return 'dev-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function slugify(name) {
    const base = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    return (base || 'team') + '-' + Math.random().toString(36).slice(2, 6);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Local (device-only) storage — never leaves the browser ----------

  function localGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function localSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function localRemove(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  // ---------- Shared storage — backed by /api/kv (Vercel KV) ----------

  async function sharedGet(key) {
    const res = await fetch('/api/kv?key=' + encodeURIComponent(key));
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('kv get failed: ' + res.status);
    const data = await res.json();
    return data.value;
  }

  async function sharedSet(key, value) {
    const res = await fetch('/api/kv', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value })
    });
    if (!res.ok) throw new Error('kv set failed: ' + res.status);
  }

  async function sharedDelete(key) {
    try {
      await fetch('/api/kv?key=' + encodeURIComponent(key), { method: 'DELETE' });
    } catch (e) {}
  }

  // ---------- Device identity + cached role ----------

  async function getDeviceId() {
    if (deviceId) return deviceId;
    let id = localGet(DEVICE_ID_KEY);
    if (!id) {
      id = uid();
      localSet(DEVICE_ID_KEY, id);
    }
    deviceId = id;
    return deviceId;
  }

  async function getCachedRole() {
    const raw = localGet(DEVICE_ROLE_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  async function setCachedRole(roleObj) {
    localSet(DEVICE_ROLE_KEY, JSON.stringify(roleObj));
  }

  async function clearCachedRole() {
    localRemove(DEVICE_ROLE_KEY);
  }

  // ---------- Room state ----------

  async function getRoomState() {
    try { return await sharedGet('room:state'); } catch (e) { return null; }
  }

  async function setRoomState(state) {
    await sharedSet('room:state', state);
  }

  async function openRoom() {
    const state = (await getRoomState()) || { phase: 'LOBBY' };
    state.opened = true;
    await setRoomState(state);
    return state;
  }

  async function startCommitRound(roundNum) {
    const state = (await getRoomState()) || { phase: 'LOBBY', opened: true };
    state.opened = true;
    state.phase = 'COMMITTING';
    state.round = roundNum;
    await setRoomState(state);
    return state;
  }

  // ---------- Teams ----------

  async function getTeams() {
    try {
      const t = await sharedGet('room:teams');
      return t || [];
    } catch (e) { return []; }
  }

  async function setTeams(teams) {
    await sharedSet('room:teams', teams);
  }

  async function addTeam(name) {
    const teams = await getTeams();
    const team = { id: slugify(name), name: name };
    teams.push(team);
    await setTeams(teams);
    return team;
  }

  async function removeTeam(teamId) {
    const teams = await getTeams();
    const next = teams.filter(t => t.id !== teamId);
    await setTeams(next);
    await sharedDelete('team:' + teamId + ':claim');
  }

  async function renameTeam(teamId, newName) {
    const teams = await getTeams();
    const next = teams.map(t => (t.id === teamId ? { ...t, name: newName } : t));
    await setTeams(next);
  }

  async function getClaim(teamId) {
    try { return await sharedGet('team:' + teamId + ':claim'); } catch (e) { return null; }
  }

  async function setClaim(teamId, dId) {
    await sharedSet('team:' + teamId + ':claim', { deviceId: dId, claimedAt: Date.now() });
  }

  // ---------- Round submissions, per-team state, per-round results ----------

  async function getRoundSubmission(teamId, round) {
    try { return await sharedGet('team:' + teamId + ':round' + round); } catch (e) { return null; }
  }
  async function setRoundSubmission(teamId, round, data) {
    await sharedSet('team:' + teamId + ':round' + round, data);
  }

  // Persistent cross-round state (completedAll / carry / trust / tokens / cumScore).
  function freshTeamState() { return { completedAll: [], carry: 0, trustAvail: false, tokens: 0, cumScore: 0 }; }
  async function getTeamState(teamId) {
    try { return (await sharedGet('team:' + teamId + ':state')) || freshTeamState(); } catch (e) { return freshTeamState(); }
  }
  async function setTeamState(teamId, st) { await sharedSet('team:' + teamId + ':state', st); }

  // Per-round resolved result (what team + facilitator screens read back).
  async function getResult(teamId, round) {
    try { return await sharedGet('team:' + teamId + ':result' + round); } catch (e) { return null; }
  }
  async function setResult(teamId, round, data) { await sharedSet('team:' + teamId + ':result' + round, data); }

  // Facilitator's device runs the engine for everyone (single-sourced dice).
  // One curveball is locked for the whole round; non-submitters resolve as an
  // empty commit (tagged autoFailed) so they're visibly distinct. Idempotent-ish:
  // only resolves while phase is COMMITTING.
  async function resolveRound(round, teams) {
    const roomState = (await getRoomState()) || { phase: 'COMMITTING', opened: true, round };
    if (roomState.phase !== 'COMMITTING') return roomState; // already resolved
    const roundIndex = round - 1;
    const cb = randomCurveball();

    const [subs, states] = await Promise.all([
      Promise.all(teams.map(t => getRoundSubmission(t.id, round))),
      Promise.all(teams.map(t => getTeamState(t.id))),
    ]);

    await Promise.all(teams.map(async (t, i) => {
      const sub = subs[i];
      const autoFailed = !sub;
      const commitIds = sub ? (sub.commitIds || []) : [];
      const spikeIds  = sub ? (sub.spikeIds  || []) : [];
      const crunch    = sub ? !!sub.crunch : false;
      const { newState, log } = resolveTeamRound({ commitIds, spikeIds, crunch, cb, roundIndex, state: states[i] });
      log.autoFailed = autoFailed;
      await Promise.all([ setResult(t.id, round, log), setTeamState(t.id, newState) ]);
    }));

    roomState.phase = 'RESOLVED';
    roomState.round = round;
    roomState.lastCb = cb;
    await setRoomState(roomState);
    return roomState;
  }

  // Advance to the next commit round (state carries; backlog is filtered by completedAll).
  async function startNextRound(teams) {
    const state = (await getRoomState()) || { phase: 'RESOLVED', opened: true, round: 1 };
    const next = (state.round || 1) + 1;
    state.phase = 'COMMITTING';
    state.round = next;
    await setRoomState(state);
    return state;
  }

  function storyName(id){ const s = byId(id); return s ? s.name : id; }
  // score a result row uses for ranking: finalScore on the last round, else running cumScore
  function rowScore(res){
    if (!res) return -Infinity;
    return (res.isFinal && typeof res.finalScore === 'number') ? res.finalScore : res.cumScore;
  }

  async function buildFacilitatorResultsHtml(round, teams) {
    const results = await Promise.all(teams.map(t => getResult(t.id, round)));
    const rows = teams.map((t, i) => ({ team: t, res: results[i] }));
    const ranked = [...rows].sort((a, b) => rowScore(b.res) - rowScore(a.res));
    const isFinal = rows.some(r => r.res && r.res.isFinal);

    const leaderboardRows = ranked.map((r, i) => {
      const res = r.res;
      const score = res ? rowScore(res) : 0;
      const tag = res && res.autoFailed
        ? '<span class="si-pill">no commit</span>'
        : `<span class="si-pill taken si-mono">${score} pt${score === 1 ? '' : 's'}</span>`;
      const missTag = (res && !res.autoFailed && !res.hitTarget) ? ' <span class="si-pill" style="border-color:var(--ember);color:var(--ember);">missed target</span>' : '';
      return `<div class="si-team-row si-team-row-fac">
        <span class="si-team-name">${i + 1}. ${escapeHtml(r.team.name)}</span>
        <span class="si-fac-row-actions">${missTag}${tag}</span>
      </div>`;
    }).join('');

    const breakdownRows = rows.map(({ team, res }) => {
      if (!res) {
        return `<div class="si-team-row si-team-row-fac"><span class="si-team-name">${escapeHtml(team.name)}</span><span class="si-pill">no record</span></div>`;
      }
      if (res.autoFailed) {
        return `<div class="si-team-row si-team-row-fac"><span class="si-team-name">${escapeHtml(team.name)}</span><span class="si-pill">didn't submit · ${res.roundScore} pts</span></div>`;
      }
      const shipped = res.completed.map(storyName).join(', ') || 'nothing shipped';
      const brokeTxt = res.broken.length ? ` · broke ${res.broken.length}` : '';
      const extras = [
        `shipped ${res.shipped}/${res.target}`,
        res.hitTarget ? (res.surplus ? `+${res.surplus} surplus` : 'target met') : `missed (−${res.miss})`,
        res.spikes.length ? `spike ×${res.spikes.length}` : null,
        res.crunched ? (res.crunchBug ? 'crunched (bug!)' : 'crunched') : null,
        res.tokensOut ? `${res.tokensOut} slack tok` : null,
        (res.isFinal && res.combo) ? 'COMBO +' + CFG.comboBonus : null,
      ].filter(Boolean).join(' · ');
      const scoreLabel = (res.isFinal && typeof res.finalScore==='number')
        ? `${res.finalScore} final` : `${res.cumScore} pts`;
      return `<div class="si-team-row si-team-row-fac">
          <span class="si-team-name">${escapeHtml(team.name)}</span>
          <span class="si-pill taken si-mono">${scoreLabel}</span>
        </div>
        <p style="color:var(--fog); font-size:0.78rem; margin:2px 0 10px;">${escapeHtml(shipped)}${brokeTxt}<br>${escapeHtml(extras)}</p>`;
    }).join('');

    const cbKey = (results.find(r => r && r.cb) || {}).cb;
    const cbLine = cbKey ? `<p style="color:var(--fog); font-size:0.82rem; margin:0 0 12px;">Curveball: <b>${CURVEBALLS[cbKey].label}</b> — ${CURVEBALLS[cbKey].desc}</p>` : '';

    return `
      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:4px;">${isFinal ? 'Final standings' : 'Round ' + round + ' — leaderboard'}</p>
        ${cbLine}
        <div class="si-team-list">${leaderboardRows}</div>
      </div>
      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:12px;">Round ${round} — breakdown</p>
        <div class="si-team-list">${breakdownRows}</div>
      </div>
    `;
  }

  // Clears every team's claim + round submissions, then resets the room to
  // a fresh LOBBY (unopened). If fullWipe is true, the team roster itself
  // is cleared too, so the next class starts from an empty add-team screen.
  // Note: only clears round1 for now — extend this list if/when round 2+
  // submissions exist.
  async function endGame(fullWipe, teams) {
    const rounds = CFG.targets.length;
    await Promise.all(teams.flatMap(t => {
      const keys = ['team:' + t.id + ':claim', 'team:' + t.id + ':state'];
      for (let r = 1; r <= rounds; r++) {
        keys.push('team:' + t.id + ':round' + r, 'team:' + t.id + ':result' + r);
      }
      return keys.map(k => sharedDelete(k));
    }));
    if (fullWipe) {
      await setTeams([]);
    }
    await setRoomState({ phase: 'LOBBY', opened: false });
  }

  // ---------- Polling ----------

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function startPolling(fn) {
    stopPolling();
    pollTimer = setInterval(fn, POLL_MS);
  }

  // ---------- Screens ----------

  async function renderLanding() {
    stopPolling();
    currentScreen = { name: 'landing' };
    view.innerHTML = `
      <div class="si-header">
        <p class="si-eyebrow">Ship It — classroom room</p>
        <h1>Join the room</h1>
      </div>
      <div class="si-role-grid">
        <button class="si-role-btn" id="si-join-team">
          <span class="si-role-title">Join as My Team</span>
          <span class="si-role-sub">Pick your team from the roster</span>
        </button>
      </div>
    `;
    document.getElementById('si-join-team').onclick = renderTeamPicker;
  }

  function renderFacilitatorPinGate(errorMsg) {
    stopPolling();
    currentScreen = { name: 'facilitator-pin' };
    view.innerHTML = `
      <div class="si-header">
        <p class="si-eyebrow">Facilitator</p>
        <h1>Enter the room PIN</h1>
      </div>
      <div class="si-card">
        <input class="si-pin-input" id="si-pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••" />
        ${errorMsg ? `<p class="si-pin-error">${escapeHtml(errorMsg)}</p>` : ''}
        <div class="si-actions">
          <button class="si-btn si-btn-primary" id="si-pin-submit">Enter</button>
        </div>
      </div>
    `;
    const input = document.getElementById('si-pin-input');
    input.focus();
    const submit = () => checkPin(input.value);
    document.getElementById('si-pin-submit').onclick = submit;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }

  async function checkPin(value) {
    if (value !== FACILITATOR_PIN) {
      renderFacilitatorPinGate('Wrong PIN — try again.');
      return;
    }
    await joinAsFacilitator();
  }

  async function joinAsFacilitator() {
    let state = await getRoomState();
    if (!state) {
      state = { phase: 'LOBBY', opened: false };
      await setRoomState(state);
    }
    await setCachedRole({ role: 'facilitator', pinPassed: true });
    renderFacilitatorDashboard();
  }

  // ---- Facilitator dashboard (roster setup + start room + open round 1) ----

  const TOTAL_ROUNDS = CFG.targets.length;

  function facilitatorActionHtml(state, teams) {
    if (!state.opened) {
      return `<button class="si-btn si-btn-primary" id="si-start-room" ${teams.length ? '' : 'disabled'}>Start room — open for sign-in</button>`;
    }
    if (state.phase === 'COMMITTING') {
      return `<button class="si-btn si-btn-primary" id="si-resolve-round">Resolve round ${state.round || 1}</button>`;
    }
    if (state.phase === 'RESOLVED') {
      const round = state.round || 1;
      if (round < TOTAL_ROUNDS) {
        return `<button class="si-btn si-btn-primary" id="si-next-round">Open round ${round + 1} — start committing</button>`;
      }
      return `<span class="si-pill open" style="padding:8px 14px;">Game over — final round resolved</span>`;
    }
    return `<span class="si-pill open" style="padding:8px 14px;">Room open</span>
      <button class="si-btn si-btn-primary" id="si-open-round1" ${teams.length ? '' : 'disabled'}>Open Round 1 — start committing</button>`;
  }

  function facilitatorHeadline(state) {
    const round = state.round || 1;
    const isFinal = round >= TOTAL_ROUNDS;
    if (state.phase === 'COMMITTING') return `Round ${round} of ${TOTAL_ROUNDS} — committing`;
    if (state.phase === 'RESOLVED') return isFinal ? 'Final standings' : `Round ${round} — resolved`;
    if (state.opened) return 'Room open for sign-in';
    return 'Setting up the room';
  }

  async function renderFacilitatorDashboard() {
    currentScreen = { name: 'facilitator' };
    const state = (await getRoomState()) || { phase: 'LOBBY', opened: false };
    const teams = await getTeams();

    view.innerHTML = `
      <div class="si-status-row"><span class="si-status-dot"></span> live · polling every ${POLL_MS / 1000}s</div>
      <div class="si-header">
        <p class="si-eyebrow">Facilitator</p>
        <h1>${facilitatorHeadline(state)}</h1>
      </div>

      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:12px;">Add a team</p>
        <div class="si-add-team-row">
          <input class="si-text-input" id="si-new-team-input" type="text" placeholder="Team name" maxlength="30" />
          <button class="si-btn si-btn-secondary" id="si-add-team-btn">Add</button>
        </div>
      </div>

      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:12px;">Roster — <span class="si-mono">${teams.length}</span> team${teams.length === 1 ? '' : 's'}</p>
        <div class="si-team-list" id="si-fac-team-list"></div>
      </div>

      ${state.phase === 'RESOLVED' ? '<div id="si-fac-results"></div>' : ''}

      <div class="si-actions">
        ${facilitatorActionHtml(state, teams)}
        <button class="si-btn si-btn-ghost" id="si-end-game">End game</button>
      </div>

      <div class="si-footer-note">
        <button class="si-back-link" id="si-back">← leave this view</button>
      </div>
    `;

    document.getElementById('si-back').onclick = renderLanding;

    document.getElementById('si-add-team-btn').onclick = onAddTeam;
    document.getElementById('si-new-team-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') onAddTeam();
    });

    const startBtn = document.getElementById('si-start-room');
    if (startBtn) {
      startBtn.onclick = async () => {
        await openRoom();
        renderFacilitatorDashboard();
      };
    }

    const openRoundBtn = document.getElementById('si-open-round1');
    if (openRoundBtn) {
      openRoundBtn.onclick = async () => {
        await startCommitRound(1);
        renderFacilitatorDashboard();
      };
    }

    const resolveBtn = document.getElementById('si-resolve-round');
    if (resolveBtn) {
      resolveBtn.onclick = async () => {
        resolveBtn.disabled = true;
        resolveBtn.textContent = 'Resolving…';
        await resolveRound(state.round || 1, teams);
        renderFacilitatorDashboard();
      };
    }

    const nextRoundBtn = document.getElementById('si-next-round');
    if (nextRoundBtn) {
      nextRoundBtn.onclick = async () => {
        await startNextRound(teams);
        renderFacilitatorDashboard();
      };
    }

    const endGameBtn = document.getElementById('si-end-game');
    if (endGameBtn) {
      endGameBtn.onclick = async () => {
        const proceed = confirm('End the game and reset the room?');
        if (!proceed) return;
        const fullWipe = confirm('Also clear the team roster?\n\nOK = wipe everything, ready for a new class.\nCancel = keep the same teams, just reset progress for a rematch.');
        await endGame(fullWipe, teams);
        renderFacilitatorDashboard();
      };
    }

    await refreshFacilitatorTeamList(teams);

    if (state.phase === 'RESOLVED') {
      const resultsEl = document.getElementById('si-fac-results');
      if (resultsEl) resultsEl.innerHTML = await buildFacilitatorResultsHtml(state.round || 1, teams);
    }

    startPolling(async () => {
      if (currentScreen.name !== 'facilitator') return;
      const t = await getTeams();
      await refreshFacilitatorTeamList(t);
    });
  }

  async function onAddTeam() {
    const input = document.getElementById('si-new-team-input');
    const name = input.value.trim();
    if (!name) return;
    input.disabled = true;
    await addTeam(name);
    input.value = '';
    input.disabled = false;
    input.focus();
    renderFacilitatorDashboard();
  }

  async function refreshFacilitatorTeamList(teams) {
    const list = document.getElementById('si-fac-team-list');
    if (!list) return;

    if (!teams.length) {
      list.innerHTML = `<div class="si-empty">No teams on the roster yet — add one above.</div>`;
      return;
    }

    const claims = await Promise.all(teams.map(t => getClaim(t.id)));

    list.innerHTML = teams.map((t, i) => {
      const claim = claims[i];
      const pill = claim
        ? `<span class="si-pill taken">claimed</span>`
        : `<span class="si-pill open">open</span>`;
      return `<div class="si-team-row si-team-row-fac" data-team-id="${t.id}">
        <span class="si-team-name" data-role="name">${escapeHtml(t.name)}</span>
        <span class="si-fac-row-actions">
          ${pill}
          <button class="si-icon-btn" data-action="rename" title="Rename team">✎</button>
          <button class="si-icon-btn" data-action="remove" title="Remove team">✕</button>
        </span>
      </div>`;
    }).join('');

    teams.forEach(t => {
      const row = list.querySelector(`[data-team-id="${t.id}"]`);
      if (!row) return;
      row.querySelector('[data-action="rename"]').onclick = () => startInlineRename(row, t);
      row.querySelector('[data-action="remove"]').onclick = () => onRemoveTeam(t);
    });
  }

  function startInlineRename(row, team) {
    const nameSpan = row.querySelector('[data-role="name"]');
    const input = document.createElement('input');
    input.className = 'si-text-input-inline';
    input.value = team.name;
    input.maxLength = 30;
    nameSpan.replaceWith(input);
    input.focus();
    input.select();

    let settled = false;
    const commit = async () => {
      if (settled) return;
      settled = true;
      const val = input.value.trim();
      if (val && val !== team.name) {
        await renameTeam(team.id, val);
      }
      const t = await getTeams();
      await refreshFacilitatorTeamList(t);
    };
    const cancel = async () => {
      if (settled) return;
      settled = true;
      const t = await getTeams();
      await refreshFacilitatorTeamList(t);
    };

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') cancel();
    });
    input.addEventListener('blur', commit);
  }

  async function onRemoveTeam(team) {
    const claim = await getClaim(team.id);
    if (claim) {
      const ok = confirm(`${team.name} has already been claimed by a device. Remove them from the roster anyway?`);
      if (!ok) return;
    }
    await removeTeam(team.id);
    renderFacilitatorDashboard();
  }

  // ---- Team join flow ----

  async function renderTeamPicker() {
    currentScreen = { name: 'team-picker' };
    stopPolling();
    const state = await getRoomState();
    const teams = await getTeams();

    if (!state || !state.opened || !teams.length) {
      view.innerHTML = `
        <div class="si-header">
          <p class="si-eyebrow">Join as My Team</p>
          <h1>Waiting for the facilitator to open the room.</h1>
        </div>
        <div class="si-footer-note">
          <button class="si-back-link" id="si-back">← back</button>
        </div>
      `;
      document.getElementById('si-back').onclick = renderLanding;
      startPolling(async () => {
        if (currentScreen.name !== 'team-picker') return;
        const s = await getRoomState();
        const t = await getTeams();
        if (s && s.opened && t.length) renderTeamPicker();
      });
      return;
    }

    view.innerHTML = `
      <div class="si-header">
        <p class="si-eyebrow">Join as My Team</p>
        <h1>Pick your team</h1>
      </div>
      <div class="si-card">
        <div class="si-team-list" id="si-team-picker-list"></div>
      </div>
      <div class="si-footer-note">
        <button class="si-back-link" id="si-back">← back</button>
      </div>
    `;
    document.getElementById('si-back').onclick = renderLanding;
    await renderTeamPickerList(teams);
    startPolling(async () => {
      if (currentScreen.name !== 'team-picker') return;
      const t = await getTeams();
      await renderTeamPickerList(t);
    });
  }

  async function renderTeamPickerList(teams) {
    const list = document.getElementById('si-team-picker-list');
    if (!list) return;
    const claims = await Promise.all(teams.map(t => getClaim(t.id)));
    list.innerHTML = teams.map((t, i) => {
      const claim = claims[i];
      const pill = claim
        ? `<span class="si-pill taken">taken</span>`
        : `<span class="si-pill open">open</span>`;
      return `<button class="si-team-row${claim ? ' claimed' : ''}" data-team-id="${t.id}"><span class="si-team-name">${escapeHtml(t.name)}</span>${pill}</button>`;
    }).join('');
    teams.forEach(t => {
      const el = list.querySelector(`[data-team-id="${t.id}"]`);
      if (el) el.onclick = () => attemptClaim(t);
    });
  }

  async function attemptClaim(team) {
    const dId = await getDeviceId();
    const claim = await getClaim(team.id);
    if (claim && claim.deviceId !== dId) {
      renderOverrideNotice(team, claim);
      return;
    }
    await setClaim(team.id, dId);
    await setCachedRole({ role: 'team', teamId: team.id, teamName: team.name });
    renderTeamEntry(team.id, team.name);
  }

  function renderOverrideNotice(team, claim) {
    view.innerHTML = `
      <div class="si-header">
        <p class="si-eyebrow">Join as My Team</p>
        <h1>${escapeHtml(team.name)}</h1>
      </div>
      <div class="si-notice">
        <div class="si-notice-title">Someone's already playing for this team</div>
        Ask them to hand you the phone, or tap below if that's you on a new device.
      </div>
      <div class="si-actions">
        <button class="si-btn si-btn-primary" id="si-override">That's me — take over</button>
        <button class="si-btn si-btn-secondary" id="si-cancel">Cancel</button>
      </div>
    `;
    document.getElementById('si-override').onclick = async () => {
      const dId = await getDeviceId();
      await setClaim(team.id, dId);
      await setCachedRole({ role: 'team', teamId: team.id, teamName: team.name });
      renderTeamEntry(team.id, team.name);
    };
    document.getElementById('si-cancel').onclick = renderTeamPicker;
  }

  // ---- Team home: routes to waiting / commit picker / submitted based on room phase ----

  async function renderTeamEntry(teamId, teamName) {
    stopPolling();
    const state = await getRoomState();

    if (!state || state.phase === 'LOBBY' || !state.opened) {
      renderTeamWaiting(teamId, teamName, 'Waiting for the facilitator to start Round 1.');
      return;
    }

    const round = state.round || 1;

    if (state.phase === 'COMMITTING') {
      const submission = await getRoundSubmission(teamId, round);
      if (submission) {
        renderTeamSubmitted(teamName, submission);
        return;
      }
      await renderTeamCommitPicker(teamId, teamName, round);
      return;
    }

    if (state.phase === 'RESOLVED') {
      await renderTeamResults(teamId, teamName, round);
      return;
    }

    renderTeamWaiting(teamId, teamName, `Round is ${state.phase.toLowerCase()} — next screens aren't built yet.`);
  }

  function renderTeamWaiting(teamId, teamName, message) {
    currentScreen = { name: 'team-waiting', teamId };
    view.innerHTML = `
      <div class="si-status-row"><span class="si-status-dot"></span> live · polling every ${POLL_MS / 1000}s</div>
      <div class="si-header">
        <p class="si-eyebrow">You're playing as</p>
        <h1 class="si-you-are">${escapeHtml(teamName)}</h1>
      </div>
      <div class="si-card">
        <p style="color:var(--fog); font-size:0.9rem; margin:0;">${escapeHtml(message)}</p>
      </div>
      <div class="si-footer-note">
        <button class="si-back-link" id="si-back">← not my team, go back</button>
      </div>
    `;
    document.getElementById('si-back').onclick = renderTeamPicker;
    startPolling(async () => {
      if (currentScreen.name !== 'team-waiting' || currentScreen.teamId !== teamId) return;
      await renderTeamEntry(teamId, teamName);
    });
  }

  async function renderTeamCommitPicker(teamId, teamName, round) {
    currentScreen = { name: 'team-commit', teamId };
    stopPolling();

    const st = await getTeamState(teamId);
    if (currentScreen.name !== 'team-commit' || currentScreen.teamId !== teamId) return;
    const s1Done = new Set(st.completedAll || []).has('S1');
    const avail = availableStories(st.completedAll);
    const capacity = CFG.capacity;
    const target = CFG.targets[round - 1];

    const local = { selected: new Set(), spikes: new Set(), crunch: false, submitting: false };

    const pe = s => planEst(s, s1Done);
    function used() {
      let t = 0;
      avail.forEach(s => { if (local.selected.has(s.id)) t += pe(s); });
      t += local.spikes.size * CFG.spikeCost;
      return t;
    }

    function draw() {
      const t = used();
      view.innerHTML = `
        <div class="si-header">
          <p class="si-eyebrow">Round ${round} of ${CFG.targets.length} — commit</p>
          <h1 class="si-you-are" style="font-size:1.6rem;">${escapeHtml(teamName)}</h1>
        </div>
        <div class="si-card">
          <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
            <p class="si-eyebrow" style="margin:0;">Capacity used</p>
            <p class="si-mono" style="margin:0; font-weight:600;">${t} / ${capacity}</p>
          </div>
          <p style="color:var(--fog); font-size:0.8rem; margin:0 0 14px;">Ship at least <b class="si-mono">${target}</b> value this round to hit the release. Tap a story to commit it; tap again to drop it.</p>
          <div class="si-team-list" id="si-backlog-list"></div>
        </div>
        <div class="si-card">
          <div class="si-team-list">
            <div class="si-team-row" id="si-crunch-toggle" style="cursor:pointer;">
              <span class="si-team-name">Crunch <span style="color:var(--fog); font-weight:400; font-size:0.82rem;">— +${CFG.crunchGain} capacity now, but a bug risk &amp; −${CFG.crunchNextPenalty} next round</span></span>
              ${local.crunch ? '<span class="si-pill taken">on</span>' : '<span class="si-pill open">off</span>'}
            </div>
          </div>
        </div>
        <div class="si-actions">
          <button class="si-btn si-btn-primary" id="si-submit-commit" ${local.submitting ? 'disabled' : ''}>
            ${local.submitting ? 'Submitting…' : (local.selected.size ? 'Submit commitment' : 'Submit with nothing')}
          </button>
        </div>
        <div class="si-footer-note">
          <button class="si-back-link" id="si-back">← not my team, go back</button>
        </div>
      `;

      const list = document.getElementById('si-backlog-list');
      list.innerHTML = avail.map(s => {
        const isSel = local.selected.has(s.id);
        const isSpiked = local.spikes.has(s.id);
        const wouldExceed = !isSel && (t + pe(s) > capacity);
        const est = pe(s);
        const discounted = est !== s.est;
        const right = isSel
          ? `<span class="si-fac-row-actions">
               <span class="si-pill${isSpiked ? ' taken' : ''}" data-action="spike" data-story-id="${s.id}" style="cursor:pointer;">${isSpiked ? '🛡 safe' : 'spike +' + CFG.spikeCost}</span>
               <span class="si-pill taken">picked</span>
             </span>`
          : `<span class="si-pill open">${wouldExceed ? 'no room' : 'pick'}</span>`;
        return `<div class="si-team-row${isSel ? ' claimed' : ''}" data-story-id="${s.id}">
          <span class="si-team-name" data-action="pick" data-story-id="${s.id}" style="cursor:pointer; flex:1;">
            ${escapeHtml(s.name)}
            <span style="color:var(--fog); font-weight:400; font-size:0.82rem;"> · value ${valueOf(s, null)} · est ${est}${discounted ? ' (was ' + s.est + ')' : ''}</span>
          </span>
          ${right}
        </div>`;
      }).join('');

      list.querySelectorAll('[data-action="pick"]').forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute('data-story-id');
          const s = byId(id);
          if (local.selected.has(id)) { local.selected.delete(id); local.spikes.delete(id); }
          else {
            if (used() + pe(s) > capacity) return;
            local.selected.add(id);
          }
          draw();
        };
      });
      list.querySelectorAll('[data-action="spike"]').forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const id = el.getAttribute('data-story-id');
          if (local.spikes.has(id)) local.spikes.delete(id);
          else {
            if (used() + CFG.spikeCost > capacity) return;
            local.spikes.add(id);
          }
          draw();
        };
      });

      document.getElementById('si-crunch-toggle').onclick = () => { local.crunch = !local.crunch; draw(); };
      document.getElementById('si-submit-commit').onclick = submit;
      document.getElementById('si-back').onclick = renderTeamPicker;
    }

    async function submit() {
      if (local.submitting) return;
      local.submitting = true;
      draw();
      const payload = {
        teamId, round,
        commitIds: Array.from(local.selected),
        spikeIds: Array.from(local.spikes),
        crunch: local.crunch,
        submittedAt: Date.now()
      };
      try {
        await setRoundSubmission(teamId, round, payload);
        renderTeamSubmitted(teamName, payload);
      } catch (e) {
        local.submitting = false;
        draw();
        alert('Could not submit — check your connection and try again.');
      }
    }

    draw();
  }

  function commitRowsHtml(commitIds, spikeIds) {
    const spikeSet = new Set(spikeIds || []);
    return (commitIds || []).map(id => {
      const s = byId(id);
      const nm = s ? s.name : id;
      const tag = spikeSet.has(id) ? '<span class="si-pill taken">🛡 spiked</span>' : '';
      return `<div class="si-team-row si-team-row-fac"><span class="si-team-name">${escapeHtml(nm)}</span>${tag}</div>`;
    }).join('');
  }

  function renderTeamSubmitted(teamName, submission) {
    const teamId = submission.teamId;
    currentScreen = { name: 'team-submitted', teamId };
    stopPolling();
    startPolling(async () => {
      if (currentScreen.name !== 'team-submitted' || currentScreen.teamId !== teamId) return;
      const s = await getRoomState();
      if (s && (s.phase === 'RESOLVED' || (s.phase === 'COMMITTING' && (s.round || 1) !== submission.round))) {
        await renderTeamEntry(teamId, teamName);
      }
    });
    const rows = commitRowsHtml(submission.commitIds, submission.spikeIds);
    view.innerHTML = `
      <div class="si-header">
        <p class="si-eyebrow">Round ${submission.round} — submitted</p>
        <h1 class="si-you-are" style="font-size:1.6rem;">${escapeHtml(teamName)}</h1>
      </div>
      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:12px;">✓ committed — waiting on the facilitator</p>
        ${(submission.commitIds && submission.commitIds.length)
          ? `<div class="si-team-list">${rows}</div>`
          : `<p style="color:var(--fog); font-size:0.9rem; margin:0;">You committed to nothing this round.</p>`}
        ${submission.crunch ? `<p style="color:var(--fog); font-size:0.85rem; margin-top:14px;">Crunch: on.</p>` : ''}
      </div>
      <div class="si-footer-note">
        <p style="color:var(--fog); font-size:0.8rem; margin:0;">Locked until the facilitator resolves the round.</p>
      </div>
    `;
  }

  // ---- Team results (round RESOLVED — shows only this team's own commitment) ----

  async function renderTeamResults(teamId, teamName, round) {
    currentScreen = { name: 'team-results', teamId };
    stopPolling();
    const res = await getResult(teamId, round);
    if (currentScreen.name !== 'team-results' || currentScreen.teamId !== teamId) return;

    const header = `
      <div class="si-header">
        <p class="si-eyebrow">${res && res.isFinal ? 'Final result' : 'Round ' + round + ' — resolved'}</p>
        <h1 class="si-you-are" style="font-size:1.6rem;">${escapeHtml(teamName)}</h1>
      </div>`;
    const back = `<div class="si-footer-note"><button class="si-back-link" id="si-back">← not my team, go back</button></div>`;
    const wire = () => { document.getElementById('si-back').onclick = renderTeamPicker; };

    if (!res) {
      view.innerHTML = header + `<div class="si-card"><p style="color:var(--fog); font-size:0.9rem; margin:0;">No result found for this round yet.</p></div>` + back;
      wire(); return;
    }

    const cb = CURVEBALLS[res.cb];
    const cbLine = cb ? `<p style="color:var(--fog); font-size:0.82rem; margin:0 0 14px;">Curveball: <b>${cb.label}</b> — ${cb.desc}</p>` : '';

    if (res.autoFailed) {
      view.innerHTML = header + `
        <div class="si-card">
          ${cbLine}
          <p class="si-eyebrow" style="margin-bottom:8px;">No commitment on record</p>
          <p style="color:var(--fog); font-size:0.9rem; margin:0;">You didn't submit before the round was resolved — missed the release (−${CFG.missPenalty}).</p>
        </div>` + back;
      wire(); return;
    }

    const bigScore = res.isFinal ? res.finalScore : res.cumScore;
    const targetPill = res.hitTarget
      ? `<span class="si-pill open">shipped ${res.shipped} / ${res.target} ✓${res.surplus ? ' · +' + res.surplus + ' surplus' : ''}</span>`
      : `<span class="si-pill" style="border-color:var(--ember);color:var(--ember);">shipped ${res.shipped} / ${res.target} · missed −${res.miss}</span>`;

    const shippedRows = res.completed.length
      ? `<div class="si-team-list">${res.completed.map(id => {
          const spiked = res.spikes.includes(id);
          return `<div class="si-team-row si-team-row-fac"><span class="si-team-name">${escapeHtml(storyName(id))}</span>${spiked ? '<span class="si-pill taken">🛡</span>' : ''}</div>`;
        }).join('')}</div>`
      : `<p style="color:var(--fog); font-size:0.9rem; margin:0;">Nothing shipped.</p>`;

    const brokeLine = res.broken.length
      ? `<p style="color:var(--ember); font-size:0.82rem; margin:12px 0 0;">Broke ${res.broken.length} promise${res.broken.length===1?'':'s'}: ${escapeHtml(res.broken.map(storyName).join(', '))} (−${CFG.brokenPenalty} each)</p>`
      : '';
    const extraBits = [
      res.crunched ? (res.crunchBug ? `Crunched — shipped a bug (−${CFG.crunchBugPenalty})` : 'Crunched for extra capacity') : null,
      res.tokensGained ? `Banked ${res.tokensGained} slack token${res.tokensGained===1?'':'s'}` : null,
      res.tokensSpent ? `Spent ${res.tokensSpent} slack token${res.tokensSpent===1?'':'s'} to absorb overruns` : null,
      (res.isFinal && res.combo) ? `Checkout combo complete — +${CFG.comboBonus}` : null,
      (res.isFinal && res.tokensOut) ? `${res.tokensOut} leftover slack token${res.tokensOut===1?'':'s'} — +${res.tokensOut * CFG.tokenEndValue}` : null,
    ].filter(Boolean);
    const extraLine = extraBits.length ? `<p style="color:var(--fog); font-size:0.82rem; margin:10px 0 0;">${extraBits.map(escapeHtml).join('<br>')}</p>` : '';

    view.innerHTML = header + `
      <div class="si-card" style="text-align:center;">
        ${cbLine}
        <p class="si-eyebrow" style="margin-bottom:2px;">${res.isFinal ? 'Final score' : 'Score so far'}</p>
        <p class="si-mono" style="font-size:2.6rem; font-weight:600; margin:0 0 8px;">${bigScore}</p>
        ${targetPill}
      </div>
      <div class="si-card">
        <p class="si-eyebrow" style="margin-bottom:12px;">Shipped this round</p>
        ${shippedRows}
        ${brokeLine}
        ${extraLine}
      </div>` + back;
    wire();
  }

  // ---------- Dev reset ----------

  document.getElementById('si-dev-reset').onclick = async () => {
    await clearCachedRole();
    renderLanding();
  };

  // ---------- Boot ----------

  (async function boot() {
    await getDeviceId();
    const params = new URLSearchParams(window.location.search);
    const wantsFacilitator = params.get('role') === 'facilitator';
    const cached = await getCachedRole();

    if (wantsFacilitator) {
      if (cached && cached.role === 'facilitator' && cached.pinPassed) {
        renderFacilitatorDashboard();
      } else {
        renderFacilitatorPinGate();
      }
      return;
    }

    if (cached && cached.role === 'facilitator' && cached.pinPassed) {
      renderFacilitatorDashboard();
    } else if (cached && cached.role === 'team') {
      renderTeamEntry(cached.teamId, cached.teamName);
    } else {
      renderLanding();
    }
  })();
})();
</script>
</body>
</html>
